/* ============================================================
   LEGACY COMPONENT LAYER — superseded by the iOS native layer below
   ============================================================ */
body{background:var(--bg);color:var(--ink)}
::selection{background:var(--pri);color:#fff}
h1,h2,h3,h4{text-rendering:optimizeLegibility}
.ico{stroke-width:1.6}
.press:active{transform:scale(.985)}
.btn{
  min-height:46px;border-radius:2px;font-size:12.5px;font-weight:600;letter-spacing:.06em;
  padding:0 18px;box-shadow:none;
}
.btn-primary{background:var(--pri);color:#fff;box-shadow:none}
.btn-primary:active{background:var(--pri-d)}
.btn-dark{background:var(--ink);color:#fff}
.btn-outline{border:1px solid var(--line2);color:var(--ink);background:transparent}
.btn-ghost{background:transparent;border:1px solid var(--line2);color:var(--pri)}
.btn-danger{background:transparent;border:1px solid rgba(159,68,49,.45);color:var(--red)}
.btn-sm{min-height:36px;font-size:10.5px;letter-spacing:.08em}
.btn-lg{min-height:52px;font-size:12.5px}
.chip-btn{
  min-height:34px;border-radius:2px;border:1px solid var(--line2);background:transparent;
  color:var(--mut);font-size:10.5px;letter-spacing:.04em;padding:0 10px;
}
.chip-btn.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:500}
.mini-btn{border-radius:2px;background:transparent;border:1px solid var(--line2);color:var(--ink);font-size:10px;letter-spacing:.08em;padding:0 12px}
.mini-btn.green{background:var(--pri);border-color:var(--pri);color:#fff}
.mini-btn.ghost{background:transparent}
.link-btn{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line2);min-height:34px;position:relative}
.link-btn:after{content:"";position:absolute;inset:-5px}
.sec-head .sec-link{font-size:9px;letter-spacing:.1em;color:var(--mut);border-bottom:1px solid var(--line2);padding-bottom:2px;min-height:34px;position:relative}
.sec-head .sec-link:after{content:"";position:absolute;inset:-5px}
.ref-mark{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase}

/* ---------- top chrome ---------- */
.topbar{
  min-height:54px;padding:0 14px;background:rgba(243,238,228,.94);
  border-bottom:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.05);
  -webkit-backdrop-filter:blur(16px) saturate(1.05);
}
.topbar .t-title{font-size:13px;font-weight:600;letter-spacing:.06em}
.topbar-actions .self-pill{background:transparent;border:1px solid var(--line2);box-shadow:none;border-radius:0;font-size:8px;letter-spacing:.1em}
.icon-btn{border-radius:50%}
.follow-btn{
  min-height:32px;border:0;border-bottom:1px solid var(--line2);border-radius:0;
  font-size:9.5px;font-weight:500;letter-spacing:.12em;padding:0 1px;color:var(--ink);
}
.follow-btn.on{background:transparent;color:var(--pri);border-bottom-color:var(--pri)}
.text-btn{font-size:10px;letter-spacing:.1em;color:var(--mut)}

/* ---------- tabbar ---------- */
.tabbar{
  background:rgba(243,238,228,.92);border-top:1px solid var(--line);
  backdrop-filter:blur(20px) saturate(1.05);-webkit-backdrop-filter:blur(20px) saturate(1.05);
  height:calc(64px + env(safe-area-inset-bottom));padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  grid-template-columns:1fr 1fr 76px 1fr 1fr;
}
.tab{height:50px;font-size:9px;letter-spacing:.08em;gap:3px}
.tab .ico{width:20px;height:20px;stroke-width:1.5}
.tab.on{color:var(--ink);font-weight:600}
.tab.on .ico{color:var(--pri)}
.tab-dot{background:var(--red);box-shadow:0 0 0 2px var(--bg);font-weight:500}
.tab-plus{height:60px;font-size:8.5px;letter-spacing:.1em}
.plus-circle{
  width:48px;height:48px;border:1px solid var(--bg);background:var(--pri);
  box-shadow:0 1px 0 rgba(25,24,20,.14);top:-11px;
}
.plus-circle .ico{width:21px;height:21px}

/* ---------- square masthead ---------- */
.sq-head{display:block;padding:20px 20px 0}
.sq-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.brandline{align-items:center;gap:9px}
.logo-mark{
  width:26px;height:26px;border-radius:50%;background:transparent;color:var(--pri);
  border:1px solid var(--line2);box-shadow:none;
}
.brand-name{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-.04em;line-height:.95}
.brand-en{font-family:var(--sans);font-size:6.5px;letter-spacing:.2em;color:var(--mut2);margin-top:4px}
.city-btn{
  min-height:44px;border:0;border-bottom:1px solid var(--line2);border-radius:0;
  background:transparent;padding:9px 1px 5px;margin-top:-6px;font-size:9.5px;letter-spacing:.1em;color:var(--mut);
}
.sq-statement{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.sq-kicker{font-size:8.5px;line-height:1;font-weight:600;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
.sq-title{
  font-family:var(--serif);font-size:34px;font-weight:400;line-height:1.18;
  letter-spacing:-.045em;margin-top:10px;color:var(--ink);
}
.sq-title em{font-style:normal;color:var(--pri);font-weight:400}
.sq-lead{font-size:11.5px;line-height:1.8;color:var(--mut);margin-top:11px;max-width:315px;letter-spacing:.01em}
.trustline{
  width:calc(100% - 40px);margin:20px 20px 0;min-height:44px;border:0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;
  background:transparent;padding:8px 1px;color:var(--mut);font-size:9.5px;letter-spacing:.04em;
}
.trustline .ico{color:var(--pri);opacity:.8;width:13px;height:13px}
.trustline .tl-main b{color:var(--ink);font-weight:500}
.trustline .chev{color:var(--mut2)}
.segbar{
  display:flex;justify-content:flex-start;gap:28px;margin:16px 20px 0;
  border-bottom:1px solid var(--line);
}
.seg{flex:0 0 auto;height:46px;min-height:46px;font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:500;padding:0 1px}
.seg.on{color:var(--ink);font-weight:600}
.seg.on:after{left:0;transform:none;width:100%;height:1px;border-radius:0;background:var(--pri);bottom:-1px}
.section{padding:26px 20px 0}
.sec-head{align-items:flex-end;margin-bottom:15px;gap:14px;flex-wrap:wrap}
.sec-head .list-filter{width:100%;margin-top:8px;justify-content:flex-start}
.sec-head h2{font-family:var(--serif);font-size:22px;font-weight:400;letter-spacing:-.035em;line-height:1.2}
.sec-head p{font-size:10.5px;line-height:1.6;color:var(--mut);margin-top:5px;letter-spacing:.015em}
.sec-head .sec-link{color:var(--mut)}
.mini-note{font-size:9px;line-height:1.7;color:var(--mut2);padding:12px 1px 0;letter-spacing:.015em}

/* ---------- match rail ---------- */
.rail-wrap{margin:0 -20px;padding:0 20px}
.match-rail{gap:12px;padding:3px 20px 20px;margin:0 -20px}
.match-card{
  flex:0 0 268px;background:rgba(251,247,239,.55);border:1px solid var(--line);
  border-radius:2px;box-shadow:none;padding:16px 16px 15px;
}
.mc-top{align-items:flex-start;min-height:42px;margin-bottom:15px}
.match-score{display:flex;align-items:baseline;gap:5px;background:none;padding:0;color:var(--ink)}
.score-num{font-family:var(--serif);font-size:34px;line-height:.85;font-weight:400;letter-spacing:-.05em}
.score-label{font-size:7px;letter-spacing:.14em;color:var(--mut2);font-weight:600}
.match-diff{font-size:9px;letter-spacing:.03em;color:var(--red);font-weight:500;text-align:right;line-height:1.5;max-width:92px;padding-top:2px}
.match-diff.even{color:var(--mut)}
.pair-row{gap:11px}
.pair-thumb{
  width:44px;height:50px;border-radius:2px;font-size:22px;border:1px solid rgba(25,24,20,.04);
  background-blend-mode:multiply;
}
.pair-thumb:before,.thumb52:before,.thumb86:before,.thumb64:before,.thumb72:before,.thumb44:before,.cover-thumb:before{display:none}
.pair-thumb .pt-mark{width:12px;height:12px;border-radius:0;background:var(--card);font-size:7px;color:var(--mut)}
.pair-kicker{font-size:8.5px;letter-spacing:.025em;margin-bottom:4px;color:var(--mut)}
.pair-title{font-family:var(--serif);font-size:16px;line-height:1.3;font-weight:400;letter-spacing:-.025em}
.pair-skill{margin-top:4px;font-size:8px}
.pair-skill .skill-badge{font-size:8px;background:transparent;border:0;padding:0;color:var(--mut)}
.pair-link{height:17px;margin-left:21px;border-left:1px dotted var(--line2)}
.pair-link i{
  left:-7px;top:1px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);
  color:var(--pri);
}
.mc-foot{border-top:1px solid var(--line);margin-top:13px;padding-top:10px;font-size:9px;color:var(--mut)}
.mc-foot .mini-av{width:18px;height:18px;font-size:8px;border-radius:50%;background:var(--pri-ll);color:var(--pri-d)}
.mc-foot .mc-name{font-weight:500;color:var(--ink)}
.mc-foot .mc-city{color:var(--mut);letter-spacing:.04em}
.match-card .btn{margin-top:12px;min-height:44px;font-size:11.5px;letter-spacing:.08em}
.rail-foot{font-size:8.5px;letter-spacing:.08em;color:var(--mut2);padding-top:2px}
.match-empty{background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:26px 0}

/* ---------- available index ---------- */
.swap-list{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none}
.swap-row{min-height:88px;padding:15px 0;gap:15px;border-bottom:1px solid var(--line)}
.swap-row:active{transform:none;background:rgba(251,247,239,.42)}
.swap-row-main{gap:0}
.swap-row-title{font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:-.025em;gap:7px}
.swap-row-title>span:first-child{overflow:hidden;text-overflow:ellipsis}
.swap-row-meta{font-size:9.8px;letter-spacing:.025em;color:var(--mut);margin-top:5px}
.swap-row-meta .money{color:var(--ink);font-weight:500}
.swap-row-meta .sep{color:var(--mut2);margin:0 5px}
.swap-round{
  width:40px;height:40px;background:transparent;border:1px solid var(--line2);color:var(--pri);
  border-radius:50%;box-shadow:none;
}
.swap-round.mine{background:transparent;border-color:var(--line);color:var(--mut2);font-size:8px;letter-spacing:.08em}
.swap-round .ico{width:16px;height:16px}
.skill-badge{background:transparent;border:0;padding:0;color:var(--mut2);font-size:8px;letter-spacing:.03em}
.skill-badge .bcheck{color:#7CB9EA}
.skill-badge.pending{color:var(--amber)}
.skill-badge.plain{color:var(--mut2)}

/* ---------- idle ---------- */
.idle-list{gap:0;border-top:1px solid var(--line)}
.idle-card{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:18px 0;gap:16px;align-items:flex-start}
.idle-card:active{transform:none;background:rgba(251,247,239,.38)}
.idle-main{align-self:auto}
.idle-title{font-family:var(--serif);font-size:19px;font-weight:400;line-height:1.36;letter-spacing:-.025em;display:-webkit-box;-webkit-line-clamp:2}
.idle-meta{font-size:9.5px;letter-spacing:.025em;margin-top:6px;color:var(--mut)}
.idle-bottom{margin-top:12px;align-items:center}
.price-red,.idle-price{font-family:var(--serif);font-size:26px;font-weight:400;letter-spacing:-.04em;color:var(--red)}
.price-red .cur{font-size:12px;font-weight:400;margin-right:2px}
.idle-note{font-size:9px;line-height:1.7;color:var(--mut2);padding:12px 1px 0}

/* ---------- mall index ---------- */
.official-strip{font-size:9px;letter-spacing:.04em;color:var(--mut);margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.self-pill{height:19px;border-radius:0;background:transparent;border:1px solid var(--line2);box-shadow:none;font-size:8px;letter-spacing:.1em;padding:0 6px;font-weight:500}
.mall-grid{gap:22px 12px}
.mall-card{background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}
.mall-card:active{transform:none;opacity:.78}
.mall-pic{
  aspect-ratio:1/1.08;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  background-blend-mode:multiply;
}
.mall-pic:after{display:none}
.mall-emoji{filter:none;text-shadow:none}
.promo-badge{
  left:0;top:0;background:var(--red);color:#fff;border-radius:0;box-shadow:none;
  font-size:8px;letter-spacing:.1em;padding:4px 7px;font-weight:500;
}
.self-badge{
  right:7px;top:7px;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:0;box-shadow:none;font-size:7px;letter-spacing:.06em;padding:3px 5px;font-weight:500;
}
.mall-body{padding:10px 0 14px;border-bottom:1px solid var(--line)}
.mall-title-row{gap:5px}
.cond-badge{
  background:transparent;color:var(--pri);border-radius:0;font-size:8px;line-height:1.1;
  padding:0 5px 0 0;border-right:1px solid var(--line2);letter-spacing:.04em;font-weight:500;
}
.mall-title{font-family:var(--serif);font-size:14.5px;font-weight:400;letter-spacing:-.02em}
.mall-price-row{margin-top:10px;gap:5px}
.mall-price{font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:-.04em;color:var(--red)}
.mall-price .cur{font-size:11px;font-weight:400;margin-right:1px}
.mall-sub{font-size:8px;letter-spacing:.03em;color:var(--mut2);opacity:1}
.mall-tags{gap:8px;margin-top:8px}
.mall-tags .mini-tag{border:0;padding:0;font-size:8.5px;color:var(--mut2);letter-spacing:.02em}
.mall-tags .mini-tag.green{color:var(--pri);background:transparent}
.mall-note{font-size:8.5px;line-height:1.7;color:var(--mut2);padding-top:14px}

/* ---------- recommendation ---------- */
.reco-nav{min-height:54px;background:rgba(243,238,228,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.05)}
.mini-brand{font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:-.03em;padding-left:7px}
.reco-tabs{gap:23px;height:54px}
.reco-tab{font-size:12.5px;letter-spacing:.04em;color:var(--mut);font-weight:400}
.reco-tab.on{font-size:13.5px;font-weight:600;color:var(--ink)}
.reco-tab.on:after{height:1px;border-radius:0;bottom:7px;background:var(--pri)}
.red-dot{width:7px;height:7px;background:#F73B4A;box-shadow:0 0 0 2.5px var(--bg);top:13px;right:-1px}
.feed-intro{padding:34px 20px 27px;border-bottom:1px solid var(--line)}
.feed-kicker{font-size:8px;letter-spacing:.24em;color:var(--mut2);font-weight:600}
.feed-h1{font-family:var(--serif);font-size:34px;font-weight:400;line-height:1.16;letter-spacing:-.045em;margin-top:12px}
.feed-sub{font-size:11px;line-height:1.8;color:var(--mut);margin-top:10px;max-width:320px}
.feed-list{padding:0 20px;counter-reset:ed-article}
.feed-card{
  background:transparent;border:0;border-radius:0;box-shadow:none;margin-bottom:34px;
  counter-increment:ed-article;
}
.feed-card:active{transform:none;opacity:.86}
.feed-cover{
  height:226px;border:1px solid var(--line);border-radius:2px;overflow:hidden;
  background-blend-mode:multiply;
}
.feed-cover:before{display:none}
.feed-cover:after{display:none}
.cover-emoji{text-shadow:none;filter:none}
.cover-note{color:rgba(25,24,20,.55);text-shadow:none;font-size:8px;letter-spacing:.08em;left:14px;bottom:12px}
.feed-body{padding:15px 0 0;padding-right:0}
.feed-body:before{content:"NO. " counter(ed-article,decimal-leading-zero);display:block;font-size:7.5px;letter-spacing:.2em;color:var(--mut2);font-weight:600;margin-bottom:8px}
.feed-title{font-family:var(--serif);font-size:23px;font-weight:400;line-height:1.35;letter-spacing:-.035em;-webkit-line-clamp:2}
.feed-meta{margin-top:13px;padding-right:52px;font-size:9.5px;letter-spacing:.02em;color:var(--mut)}
.av-xs{width:20px;height:20px;font-size:8px;border:1px solid rgba(25,24,20,.06)}
.feed-name{font-weight:500;color:var(--ink);max-width:88px}
.feed-stats{gap:10px;font-size:8.5px;color:var(--mut)}
.rec-swap{
  width:38px;height:38px;right:0;bottom:1px;background:transparent;color:var(--ink);
  border:1px solid var(--line2);box-shadow:none;font-family:var(--serif);font-size:15px;font-weight:400;
}
.rec-swap:active{transform:scale(.94);background:var(--pri);color:#fff;border-color:var(--pri)}
.feed-empty{background:transparent;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:38px 0;font-size:10px;color:var(--mut)}

/* ---------- content detail ---------- */
.detail-page{background:var(--bg)}
.detail-author .av-xs{width:28px;height:28px;font-size:9px}
.detail-author-name{font-size:11.5px;letter-spacing:.02em}
.gallery{border-bottom:1px solid var(--line)}
.gal-slide{height:380px;background-blend-mode:multiply}
.gal-slide:before,.gal-slide:after{display:none}
.gal-cap{background:rgba(251,247,239,.82);color:var(--ink);border-radius:0;font-size:8px;letter-spacing:.08em;backdrop-filter:none;bottom:16px}
.gal-dots{background:transparent;padding:0;gap:5px;bottom:14px;backdrop-filter:none}
.gal-dot{width:4px;height:4px;background:rgba(25,24,20,.25)}
.gal-dot.on{width:14px;background:var(--pri)}
.detail-content{padding:28px 20px 12px}
.detail-kicker{font-size:9.5px;letter-spacing:.08em;color:var(--mut);margin-bottom:12px;text-transform:uppercase}
.detail-kicker .cat-chip{background:transparent;border:0;border-bottom:1px solid var(--line2);padding:0 0 2px;font-size:8px}
.detail-title{font-family:var(--serif);font-size:31px;font-weight:400;line-height:1.28;letter-spacing:-.045em}
.detail-body{font-size:13.5px;line-height:1.95;color:#3B362E;margin-top:20px;letter-spacing:.01em}
.topic-row{gap:12px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.topic-static{background:transparent;color:var(--mut);border:0;border-bottom:1px solid var(--line2);border-radius:0;padding:0 0 2px;font-size:9.5px;letter-spacing:.04em}
.detail-date{font-size:8.5px;letter-spacing:.04em;color:var(--mut2);margin-top:18px}
.comment-block{margin:24px 20px 0;border-top:1px solid var(--line);padding-top:20px}
.comment-head h3{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:-.02em}
.comment-head span{font-size:8px;letter-spacing:.04em}
.comment-row{padding:14px 0;border-bottom:1px solid rgba(226,216,199,.55)}
.comment-row:last-child{border-bottom:0}
.comment-av{width:28px;height:28px;font-size:9px}
.comment-name{font-size:8.5px;letter-spacing:.02em}
.comment-text{font-size:12px;line-height:1.7;margin-top:4px}
.feed-follow-note{font-size:8.5px;letter-spacing:.04em;color:var(--mut2);padding:20px 20px 26px}
.reco-bar{
  background:rgba(247,242,233,.95);border-top:1px solid var(--line);
  height:calc(60px + env(safe-area-inset-bottom));backdrop-filter:blur(16px) saturate(1.05);
}
.bar-icon{color:var(--mut)}
.bar-icon.on{color:var(--red)}
.bar-icon small{font-size:8px;letter-spacing:.02em}
.swap-fab{
  width:48px;height:48px;background:var(--pri);border:3px solid var(--bg);color:#fff;
  font-family:var(--serif);font-size:16px;box-shadow:0 1px 0 rgba(25,24,20,.12);
}
.comment-box{
  width:calc(50% - 42px);background:transparent;border-bottom:1px solid var(--line2);
  border-radius:0;height:36px;padding:0 2px;
}
.comment-box input{font-size:11px}
.comment-send{width:36px;height:36px;min-height:36px}

/* ---------- profile ---------- */
.profile-head{padding:28px 20px 0}
.prof-top{gap:16px;align-items:flex-start}
.av-lg{
  width:74px;height:88px;border-radius:2px;background:var(--card) !important;border:1px solid var(--line);
  font-family:var(--serif);font-size:30px;font-weight:400;color:var(--ink);box-shadow:none;
}
.av-lg:before{display:none}
.prof-main{padding-right:0}
.prof-name{font-family:var(--serif);font-size:29px;font-weight:400;letter-spacing:-.05em;line-height:1.1;padding-right:30px}
.prof-real{background:transparent;color:var(--mut2);font-size:7.5px;letter-spacing:.12em;padding:0;border:0}
.prof-id{font-size:9.5px;letter-spacing:.04em;color:var(--mut2);margin-top:6px;gap:6px}
.prof-tags{gap:6px;margin-top:12px}
.tag{
  background:rgba(118,118,128,.10);color:var(--mut);border-radius:6px;font-size:11px;
  padding:4px 8px;letter-spacing:0;border:0;
}
.tag.has-cert{padding-right:15px}
.tag .ck{color:#7CB9EA}
.tag .tagst{font-size:8.5px;color:var(--amber)}
.tag-add{border:1px dashed rgba(29,75,55,.55);color:var(--pri);font-size:10.5px;padding:4px 7px}
.prof-setting{right:10px;top:18px;color:var(--mut)}
.prof-bio{font-size:12px;line-height:1.8;color:var(--mut);margin-top:14px;max-width:100%}
.prof-stats{gap:22px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:8px;letter-spacing:.08em;color:var(--mut2);text-transform:uppercase}
.prof-stats b{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:-.02em;color:var(--ink);margin-right:3px}
.swap-entry{
  margin:22px 20px 0;width:calc(100% - 40px);background:var(--deep);color:#fff;border-radius:2px;
  padding:14px 15px;box-shadow:none;
}
.se-ico{width:34px;height:34px;border-radius:50%;background:transparent;border:1px solid rgba(255,255,255,.22);color:#D9E5DC}
.se-main b{font-family:var(--serif);font-size:15px;font-weight:400;letter-spacing:-.01em}
.se-main span{font-size:8.5px;letter-spacing:.03em;color:rgba(255,255,255,.52);margin-top:4px}
.profile-tabs{
  display:flex;gap:25px;margin:24px 20px 0;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.profile-tabs::-webkit-scrollbar{display:none}
.ftab{
  flex:0 0 auto;min-height:44px;height:44px;border-radius:0;font-size:10.5px;letter-spacing:.08em;
  color:var(--mut);font-weight:500;padding:0 1px;position:relative;
}
.ftab.on{background:linear-gradient(180deg,rgba(29,75,55,.075),rgba(29,75,55,.012));color:var(--ink);font-weight:600;box-shadow:none}
.ftab.on:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--pri)}
.ftab:after{inset:auto}
.ptab-panel{padding:0 20px}
.profile-swipe-wrap{margin-top:16px}
.panel-head{margin:18px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.panel-head h3{font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:-.02em}
.panel-head span{font-size:8px;letter-spacing:.06em;color:var(--mut2)}
.work-grid{gap:14px 10px}
.work-card{background:transparent;border:1px solid var(--line);border-radius:2px;box-shadow:none}
.work-pic{aspect-ratio:1/1.12;border-radius:0}
.work-body{padding:9px 8px 10px}
.work-title{font-family:var(--serif);font-size:12.5px;font-weight:400;line-height:1.45;min-height:36px}
.work-meta{font-size:8px;letter-spacing:.02em;color:var(--mut2)}
.compact-row{padding:12px 0;border-bottom:1px solid var(--line);gap:12px}
.compact-title{font-family:var(--serif);font-size:13px;font-weight:400;letter-spacing:-.01em}
.compact-sub{font-size:8.5px;letter-spacing:.02em;margin-top:3px}
.compact-price{font-family:var(--serif);font-size:13px;font-weight:400;letter-spacing:-.02em}
.panel-empty{background:transparent;border:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0;padding:26px 0;font-size:9.5px;line-height:1.8}
.panel-empty b{font-family:var(--serif);font-size:15px;font-weight:400;margin-bottom:4px}
.orders-block,.tools-block{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:18px 0 0}
.orders-block{margin:26px 20px 0}
.block-head h3,.tools-head h3{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:-.02em}
.order-grid{margin-top:14px;gap:0}
.order-cell{min-height:70px;border-right:1px solid var(--line);border-radius:0}
.order-cell:last-child{border-right:0}
.order-cell:active{background:rgba(251,247,239,.35)}
.order-ico{width:32px;height:32px;background:transparent;border:1px solid var(--line);border-radius:50%;color:var(--mut)}
.order-label{font-size:8px;letter-spacing:.05em;color:var(--mut)}
.order-badge{top:4px;right:calc(50% - 24px);background:var(--red);font-size:8px;font-weight:500;box-shadow:0 0 0 2px var(--bg)}
.tools-block{margin:20px 20px 26px;padding:18px 0}
.tools-head span{font-size:8px;letter-spacing:.02em;color:var(--mut2)}
.tools-grid{margin-top:12px}
.tool{padding:14px 4px;min-height:78px;border-radius:0}
.tool:active{background:rgba(251,247,239,.35)}
.tool-ico{background:transparent;border:1px solid var(--line);color:var(--ink);width:36px;height:36px;border-radius:50%}
.tool span{font-size:8.5px;letter-spacing:.02em;color:var(--mut)}
.mini-note,.work-meta{text-transform:none}

/* ---------- publish ---------- */
.publish-page{background:var(--bg)}
.pub-head{min-height:54px;background:rgba(243,238,228,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.pub-title{font-family:var(--serif);font-size:19px;font-weight:400;letter-spacing:-.02em}
.pub-switch{font-size:9.5px;letter-spacing:.08em;color:var(--mut)}
.pub-publish{background:var(--pri);color:#fff;border-radius:2px;min-height:36px;font-size:10px;letter-spacing:.1em;padding:0 12px}
.pub-body{padding:18px 20px 34px}
.pub-section{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:none;padding:20px 0;margin-bottom:0}
.pub-sec-title{margin-bottom:14px}
.pub-sec-title h3{font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:-.02em}
.pub-sec-title span{font-size:8px;letter-spacing:.06em;color:var(--mut2)}
.upload-grid{gap:8px}
.up-tile{aspect-ratio:1/1.05;border:1px dashed var(--line2);border-radius:2px;background:transparent;color:var(--mut2);font-size:8px;letter-spacing:.04em}
.up-tile.filled{background-blend-mode:multiply;border:1px solid var(--line)}
.up-add .plusline{background:transparent;border:1px solid var(--line2);width:26px;height:26px}
.up-remove{background:rgba(25,24,20,.55);width:24px;height:24px;min-height:24px}

.segmented{background:transparent;border:1px solid var(--line2);border-radius:2px;padding:0;gap:0}
.segmented button{min-height:40px;height:40px;border-radius:0;font-size:9.5px;letter-spacing:.04em;border-right:1px solid var(--line2)}
.segmented button:last-child{border-right:0}
.segmented button.on{background:var(--pri);color:#fff;box-shadow:none;font-weight:500}

.sheet-submit .btn{min-height:50px;border-radius:2px;font-size:11px;letter-spacing:.1em}
.submit-note{font-size:7.5px;color:var(--mut2);letter-spacing:.02em}
.success-sheet .success-inner h2{font-family:var(--serif);font-size:28px;font-weight:400;letter-spacing:-.045em}
.success-inner p{font-size:9px;line-height:1.8;color:var(--mut);margin-top:9px}
.success-mark svg{filter:none}

.success-tick{stroke:var(--pri);stroke-width:3}

.success-actions .btn{min-height:46px;border-radius:2px;font-size:10px}
.prop-status .ref-mark{color:var(--mut2);font-size:7.5px}

.prop-item .pi-label{font-size:7.5px;color:var(--mut2);letter-spacing:.04em}

.prop-line .pk{color:var(--mut2);font-size:8.5px}
.prop-timeline{margin:16px 0 12px}
.prop-step span{font-size:7.5px;letter-spacing:.02em}
.prop-step:before{background:var(--line)}

.prop-note-box{background:transparent;border:0;border-left:2px solid var(--amber);border-radius:0;padding:3px 0 3px 12px;font-size:8.5px;line-height:1.8;color:var(--mut)}
.demo-action{border:1px dashed var(--line2);border-radius:2px;background:transparent;color:var(--mut);font-size:8.5px;min-height:36px}
.service-card{background:transparent;border:1px solid var(--line);border-radius:2px;box-shadow:none;padding:13px}
.service-avatar{background:var(--pri);border-radius:50%}
.thread-list{padding:8px 0 12px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:2px 10px 10px 10px;box-shadow:none;font-size:11px;line-height:1.8;padding:10px 12px}
.bubble-row.me .bubble{background:var(--pri);border-color:var(--pri);border-radius:10px 2px 10px 10px;color:#fff}

.thread-composer{border:1px solid var(--line2);border-radius:2px;background:transparent;padding:4px 4px 4px 12px}

.thread-send{background:var(--pri);border-radius:2px;font-size:9px;letter-spacing:.08em;min-height:36px}
.address .addr-card{background:transparent}
.publish-option{background:transparent;border:0;border-top:1px solid var(--line);border-radius:0;padding:16px 1px;min-height:78px}
.publish-option.main{background:transparent;border-color:var(--line)}
.po-ico{background:transparent;border:1px solid var(--line2);border-radius:50%;color:var(--pri)}
.publish-option.main .po-ico{background:var(--pri);border-color:var(--pri);color:#fff}
.po-main b{font-family:var(--serif);font-size:16px;font-weight:400;letter-spacing:-.02em}
.po-main span{font-size:8.5px;line-height:1.7;color:var(--mut);margin-top:4px}
.po-arrow{color:var(--mut2)}
.palette-grid{gap:10px}
.palette-swatch{border-radius:2px;border:1px solid var(--line);box-shadow:none}
.palette-name{font-size:8px;letter-spacing:.02em}
.song-row{border-bottom:1px solid var(--line);min-height:54px}
.song-play{background:transparent;border:1px solid var(--line2);color:var(--pri)}
.song-name{font-family:var(--serif);font-size:13px;font-weight:400}
.song-time{font-size:8px;color:var(--mut2)}
.city-grid{gap:7px}
.city-option{border-radius:2px;border-color:var(--line2);font-size:10.5px;min-height:48px;background:transparent}
.city-option.on{background:var(--pri);border-color:var(--pri)}
.sheet-input{background:transparent;border:1px solid var(--line2);border-radius:2px;font-size:12px;min-height:48px}
.policy-card{background:transparent;border:1px solid var(--line);border-radius:2px;box-shadow:none;padding:16px}
.policy-card h2{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:-.02em}
.policy-card p,.policy-list li{font-size:10.5px;line-height:1.9}
.policy-label{font-size:7.5px;letter-spacing:.12em}
.banned-tag{background:transparent;border:1px solid var(--line);border-radius:0;color:var(--mut);font-size:8.5px;padding:3px 6px}
.compare-cell{background:transparent;border:1px solid var(--line);border-radius:2px}
.privacy-hero h1{font-family:var(--serif);font-size:36px;font-weight:400;letter-spacing:-.05em}
.privacy-hero p{font-size:10.5px;line-height:1.9;color:var(--mut);margin-top:9px}
.privacy-wrap{padding:18px 20px 0}
.settings-card{background:transparent;border:0;border-radius:0;box-shadow:none;margin-bottom:0;border-top:1px solid var(--line)}
.set-row{background:transparent;border-bottom:1px solid var(--line);min-height:58px;padding:14px 1px}
.set-ico{background:transparent;border:1px solid var(--line);border-radius:50%;color:var(--mut)}
.set-main b{font-family:var(--serif);font-size:13px;font-weight:400}
.set-main span{font-size:8.5px;line-height:1.6;color:var(--mut2)}
.set-row.danger .set-ico{background:transparent;border-color:rgba(159,68,49,.35);color:var(--red)}
.set-row.danger .set-main b{color:var(--red)}
.skill-status-list{background:transparent;border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line)}
.skill-status-row{border-bottom:1px solid var(--line);padding:14px 1px}
.skill-status-main b{font-family:var(--serif);font-size:13px;font-weight:400}
.skill-status-main span{font-size:8.5px;color:var(--mut2)}
.skill-state{font-size:8.5px}
.bluecheck{color:#7CB9EA}
.toast{background:var(--ink);border-radius:2px;font-size:10px;letter-spacing:.02em;box-shadow:0 10px 30px rgba(25,24,20,.18);padding:11px 15px}

/* ============================================================
   iOS NATIVE LAYER — system grouped background, white cards,
   SF hierarchy, segmented controls, restrained tint
   ============================================================ */
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --line:#E5E5EA;
  --line2:#D1D1D6;
  --ink:#000000;
  --mut:#8E8E93;
  --mut2:#C7C7CC;
  --pri:#147A4C;
  --pri-d:#0C5C38;
  --pri-l:#E8F5EC;
  --pri-ll:#F2FAF5;
  --red:#D70015;
  --amber:#C93400;
  --radius:16px;
  --radius-s:12px;
  --radius-xs:8px;
  --shadow:0 1px 2px rgba(0,0,0,.035),0 8px 24px rgba(0,0,0,.06);
  --shadow-s:0 1px 2px rgba(0,0,0,.028);
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --deep:#1C1C1E;
}
html,body{background:var(--bg)}
body{color:#000;font-family:var(--sans)}
#app{background:var(--bg)}
button{font-family:var(--sans)}
.ico{stroke-width:1.8}
.btn{
  border-radius:12px;min-height:50px;font-size:15px;font-weight:600;letter-spacing:-.1px;
  padding:0 18px;box-shadow:none
}
.btn-primary{background:var(--pri);color:#fff;box-shadow:none}
.btn-primary:active{background:var(--pri-d)}
.btn-outline{background:var(--card);border:1px solid var(--line);color:var(--ink)}
.btn-ghost{background:var(--pri-ll);border:0;color:var(--pri-d)}
.btn-danger{background:#FFF1F0;border:0;color:var(--red)}
.btn-sm{min-height:36px;border-radius:9px;font-size:13px}
.btn-lg{min-height:52px;border-radius:13px;font-size:16px}
.chip-btn{
  min-height:32px;padding:0 12px;border:0;border-radius:999px;background:rgba(118,118,128,.12);
  color:#000;font-size:13px;letter-spacing:-.1px;font-weight:500;gap:4px
}
.chip-btn.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.mini-btn{min-height:32px;border:0;border-radius:999px;background:var(--pri-ll);color:var(--pri-d);font-size:13px;font-weight:600;padding:0 14px}
.mini-btn.green{background:var(--pri);color:#fff}
.link-btn,.sec-head .sec-link{font-size:13px;font-weight:500;letter-spacing:-.1px;color:var(--pri);border:0;min-height:32px;padding:0;text-transform:none}
.link-btn:after,.sec-head .sec-link:after{display:none}
.ref-mark{font-size:11px;color:var(--mut);letter-spacing:0;text-transform:none}
.press:active{transform:scale(.98)}
input,textarea,select{font-family:var(--sans)}

/* navigation bars */
.topbar,.reco-nav,.pub-head{
  background:rgba(249,249,249,.94);border-bottom:.5px solid #C6C6C8;
  backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15)
}
.topbar{min-height:44px;padding:0 8px}
.topbar .t-title{font-size:17px;font-weight:600;letter-spacing:-.2px;text-align:center}
.topbar-center{text-align:center}
.topbar .icon-btn{color:var(--pri)}
.text-btn{color:var(--pri);font-size:15px;font-weight:500;letter-spacing:-.1px;min-height:44px}
.text-btn.muted{color:var(--pri);font-size:13px}
.topbar-actions .self-pill,.mall-detail-page .self-pill{
  background:var(--pri-ll);border:0;box-shadow:none;border-radius:999px;color:var(--pri-d);
  font-size:10px;letter-spacing:.02em;height:22px;padding:0 8px
}
.follow-btn{
  min-height:30px;padding:0 12px;border:0;border-radius:999px;background:var(--pri-ll);
  color:var(--pri-d);font-size:13px;font-weight:600;letter-spacing:0
}
.follow-btn.on{background:rgba(118,118,128,.12);color:var(--mut);border:0}
.pub-head{min-height:44px;padding:0 8px}
.pub-head .icon-btn{color:var(--pri)}
.pub-title{font-size:17px;font-weight:600;letter-spacing:-.2px;text-align:center}
.pub-switch{color:var(--pri);font-size:13px;font-weight:500;letter-spacing:0;min-height:44px;padding:0 6px}
.pub-publish{background:transparent;color:var(--pri);min-height:44px;font-size:15px;font-weight:600;padding:0 4px;border-radius:0;letter-spacing:-.1px}

/* tab bar */
.tabbar{
  background:rgba(249,249,249,.94);border-top:.5px solid #C6C6C8;
  height:calc(66px + env(safe-area-inset-bottom));padding:5px 8px calc(5px + env(safe-area-inset-bottom));
  grid-template-columns:1fr 1fr 72px 1fr 1fr;
  backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15)
}
.tab{height:52px;min-height:52px;gap:2px;font-size:10px;letter-spacing:-.1px;color:var(--mut)}
.tab .ico{width:23px;height:23px;stroke-width:1.7}
.tab.on{color:var(--pri);font-weight:600}
.tab.on .ico{color:var(--pri)}
.tab-plus{height:60px;font-size:9px;letter-spacing:0;color:var(--mut)}
.plus-circle{width:48px;height:48px;background:var(--pri);border:3px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.14);top:-10px}
.plus-circle .ico{width:22px;height:22px}
.tab-dot{background:var(--red);box-shadow:0 0 0 2px rgba(249,249,249,.95);font-weight:600}

/* iOS grouped page */
.page{background:var(--bg)}
.square-page,.recommend-page,.messages-page,.profile-page,.center-page,.cart-page,.checkout-page,.publish-page,.plain-page,.detail-page,.mall-detail-page{background:var(--bg)}
.section{padding:20px 16px 0}
.sec-head{margin-bottom:10px;gap:10px;flex-wrap:wrap;align-items:flex-end}
.sec-head h2{font-family:var(--sans);font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.25;color:#000}
.sec-head p{font-size:13px;line-height:1.45;color:var(--mut);margin-top:3px;letter-spacing:-.05px}
.sec-head .list-filter{width:100%;margin-top:9px;gap:6px;justify-content:flex-start}
.mini-note,.mall-note,.idle-note{font-size:12px;line-height:1.5;color:var(--mut);padding:9px 2px 0;letter-spacing:-.05px}

/* square large title */
.sq-head{padding:4px 16px 0;background:var(--bg)}
.sq-topline{height:44px;align-items:center;gap:10px}
.brandline{align-items:center;gap:8px}
.logo-mark{width:27px;height:27px;border-radius:8px;background:var(--pri);color:#fff;border:0;box-shadow:none}
.logo-mark svg{width:17px;height:17px}
.brand-name{font-family:var(--sans);font-size:17px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.brand-en{font-family:var(--sans);font-size:10.5px;font-weight:400;letter-spacing:0;color:var(--mut);margin-top:2px}
.city-btn{
  min-height:44px;border:0;background:transparent;padding:0;margin:0;border-radius:0;
  color:var(--pri);font-size:15px;font-weight:500;letter-spacing:-.1px;gap:3px
}
.city-btn .ico{color:var(--pri)}
.sq-statement{margin:0;padding:0 0 2px;border:0}
.sq-title{font-family:var(--sans);font-size:34px;font-weight:700;line-height:1.18;letter-spacing:-.6px;margin-top:2px;color:#000}
.sq-title em{font-style:normal;color:var(--pri);font-weight:700}
.sq-lead{font-size:15px;line-height:1.4;color:var(--mut);margin-top:2px;max-width:100%;letter-spacing:-.1px}
.trustline{
  width:calc(100% - 32px);margin:12px 16px 0;min-height:44px;border:0;border-radius:12px;
  background:var(--pri-ll);padding:10px 12px;font-size:12px;line-height:1.4;color:var(--pri-d);
  letter-spacing:-.05px;gap:7px
}
.trustline .ico{color:var(--pri)}
.trustline .tl-main b{color:var(--pri-d);font-weight:600}
.trustline .chev{color:rgba(20,122,76,.45)}
.segbar{
  display:flex;justify-content:stretch;gap:2px;margin:14px 16px 0;padding:2px;
  border:0;border-radius:9px;background:rgba(118,118,128,.12)
}
.seg{
  flex:1;height:32px;min-height:32px;padding:0 4px;border-radius:7px;background:transparent;
  color:#000;font-size:13px;font-weight:500;letter-spacing:-.1px;position:relative
}
.seg:before{content:"";position:absolute;inset:-5px 0}
.seg.on{background:#fff;color:#000;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.seg.on:after{display:none}

/* match rail */
.rail-wrap{margin:0 -16px;padding:0 16px}
.match-rail{gap:12px;padding:2px 16px 16px;margin:0 -16px}
.match-card{
  flex:0 0 268px;background:#fff;border:0;border-radius:18px;box-shadow:var(--shadow);
  padding:14px;min-height:0
}
.mc-top{align-items:center;min-height:24px;margin-bottom:12px}
.match-score{
  display:inline-flex;align-items:baseline;gap:3px;background:var(--pri-ll);color:var(--pri-d);
  border-radius:999px;padding:3px 8px;line-height:1;font-weight:600
}
.score-num{font-family:var(--sans);font-size:14px;line-height:1;font-weight:700;letter-spacing:-.2px}
.score-label{font-size:10.5px;letter-spacing:-.1px;color:var(--pri)}
.match-diff{font-size:11.5px;line-height:1.35;font-weight:500;color:var(--red);max-width:96px;text-align:right;letter-spacing:-.1px;padding-top:0}
.match-diff.even{color:var(--mut)}
.pair-row{gap:10px}
.pair-thumb{width:44px;height:44px;border-radius:10px;font-size:22px;border:0;box-shadow:none}

/* image sizes */
.thumb52,.thumb86,.thumb64,.thumb44,.thumb72,.pair-thumb,.pick-thumb,.deduct-pic,.tx-thumb,.up-tile.filled,.work-pic,.cart-line .thumb72,.feed-cover,.mall-pic,.gal-slide{box-shadow:none}
.thumb52,.thumb86,.thumb64,.thumb44,.thumb72,.pick-thumb,.deduct-pic,.tx-thumb,.work-pic{border-radius:10px;border:0}
.thumb52{width:52px;height:52px;font-size:26px}
.thumb86{width:76px;height:76px;font-size:34px;border-radius:12px}
.thumb64{width:64px;height:64px;font-size:28px;border-radius:10px}
.thumb44{width:46px;height:46px;font-size:21px;border-radius:9px}
.thumb72{width:64px;height:64px;font-size:28px;border-radius:10px}
.pick-thumb{height:60px;font-size:28px;border-radius:8px}
.up-emoji{font-size:31px}
.cover-emoji{font-size:64px}
.gal-emoji{font-size:98px}
.mall-emoji{font-size:52px}
.pair-thumb{font-size:22px}
.cover-note{background:rgba(255,255,255,.86);color:#000;text-shadow:none;padding:3px 7px;border-radius:6px;font-size:10px;letter-spacing:-.05px;left:10px;bottom:10px}
.cat-chip{background:rgba(255,255,255,.9);color:#000;font-size:10px;font-weight:600;letter-spacing:-.05px;padding:3px 7px;border-radius:6px;text-transform:none;backdrop-filter:none}

/* available list */
.swap-list{background:#fff;border:0;border-radius:12px;box-shadow:none;overflow:hidden;padding:0 14px}
.swap-row{min-height:68px;padding:10px 0;gap:12px;border-bottom:.5px solid var(--line);background:transparent}
.swap-row:last-child{border-bottom:0}
.swap-row:active{transform:none;background:rgba(118,118,128,.06)}
.swap-row-main{gap:0}

.swap-row-meta .money{color:#000;font-weight:500}
.swap-row-meta .sep{color:var(--mut2);margin:0 4px}
.swap-round{width:36px;height:36px;border:0;background:var(--pri-ll);color:var(--pri);border-radius:50%;box-shadow:none}
.swap-round.mine{background:rgba(118,118,128,.10);border:0;color:var(--mut);font-size:10px;letter-spacing:-.05px}
.swap-round .ico{width:16px;height:16px}
.skill-badge{background:rgba(118,118,128,.10);border:0;padding:2px 5px;border-radius:4px;color:var(--mut);font-size:10px;letter-spacing:-.05px}
.skill-badge .bcheck{color:#7CB9EA}
.skill-badge.pending{color:var(--amber)}
.skill-badge.plain{color:var(--mut)}

/* idle */
.idle-list{background:#fff;border:0;border-radius:12px;box-shadow:none;padding:0 14px;gap:0}

.idle-card:last-child{border-bottom:0}

.idle-main{align-self:auto}
.idle-title{font-family:var(--sans);font-size:15px;font-weight:600;line-height:1.4;letter-spacing:-.2px;color:#000;-webkit-line-clamp:2}
.idle-meta{font-size:12px;line-height:1.4;color:var(--mut);margin-top:4px;letter-spacing:-.05px}
.idle-bottom{margin-top:8px;align-items:center}

.idle-note{font-size:12px;line-height:1.5;color:var(--mut);padding:9px 2px 0}

/* mall product grid */
.official-strip{font-size:12px;line-height:1.4;color:var(--mut);border-bottom:0;padding:0;margin-bottom:10px;letter-spacing:-.05px;gap:6px}

.mall-card:active{transform:none;opacity:.82}
.mall-pic{aspect-ratio:1/1.04;border:0;border-radius:0;background-blend-mode:normal}
.mall-emoji{filter:none;text-shadow:none}
.promo-badge{left:8px;top:8px;background:var(--red);color:#fff;border-radius:6px;box-shadow:none;font-size:10px;font-weight:600;padding:3px 6px;letter-spacing:-.1px}

.mall-body{padding:9px 10px 11px;border-bottom:0}
.mall-title-row{gap:4px}
.cond-badge{background:var(--pri);color:#fff;border-radius:4px;font-size:10px;line-height:1;padding:2px 4px;border:0;letter-spacing:-.05px;font-weight:600}
.mall-title{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:-.15px;color:#000}
.mall-price-row{margin-top:7px;gap:4px}

.cover-emoji{font-size:66px;filter:none;text-shadow:none}
.cover-note{background:rgba(255,255,255,.86);color:#000;text-shadow:none;border-radius:6px;padding:3px 7px;font-size:10px;left:10px;bottom:10px;letter-spacing:-.05px}
.cover-note{max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-chip{background:rgba(255,255,255,.9);color:#000;font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;left:10px;top:10px;letter-spacing:-.05px;text-transform:none}

/* content detail */
.detail-page{background:var(--bg);padding-bottom:calc(88px + env(safe-area-inset-bottom))}

}

/* ============================================================
   iOS MOTION LAYER — causal motion only
   Apple rules: press → track → project → spring, never lock input
   ============================================================ */
:root{
  --ios-spring:cubic-bezier(.22,1,.36,1);
  --ios-nav-spring:cubic-bezier(.32,.72,0,1);
  --ios-nav:.36s;
  --ios-tab:.22s;
  --ios-segment:.28s;
}
.page{animation:none;transform-origin:50% 0}
.page.motion-forward{animation:iosPushIn var(--ios-nav) var(--ios-nav-spring) backwards}
.page.motion-back{animation:iosPopIn .32s var(--ios-nav-spring) backwards}
.page.motion-tab{animation:iosTabIn var(--ios-tab) ease-out backwards}
.page.motion-fade{animation:iosFadeIn .26s ease-out backwards}
.page.motion-segment{animation:none!important}
.page.motion-segment .segment-body,
.page.motion-segment .feed-intro,
.page.motion-segment .feed-list,
.page.motion-segment .center-list,
.page.motion-segment .pub-body{animation:iosContentIn .26s ease-out both}
@keyframes iosPushIn{from{opacity:.62;transform:translate3d(22%,0,0)}to{opacity:1;transform:none}}
@keyframes iosPopIn{from{opacity:.7;transform:translate3d(-11%,0,0)}to{opacity:1;transform:none}}
@keyframes iosTabIn{from{opacity:.88;transform:scale(.997) translateY(4px)}to{opacity:1;transform:none}}
@keyframes iosFadeIn{from{opacity:0}to{opacity:1}}
@keyframes iosContentIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* one causal motion: native tabbar icon, no entrance churn */
.tab .ico{transition:transform .24s var(--ios-nav-spring),color .18s ease-out}
.tab.on .ico{transform:translateY(-1px) scale(1.04)}
.tab:active .ico{transform:scale(.94)}
.stagger>*{animation:none!important}

/* segmented control: one moving pill, no re-layout */
[data-seg-key]{position:relative;isolation:isolate}
[data-seg-key]>button{position:relative;z-index:1}
[data-seg-key]>button.on{background:transparent!important;box-shadow:none!important}
[data-seg-key]>button:after{display:none!important}
.seg-pill{
  position:absolute;left:0;top:2px;bottom:2px;width:0;z-index:0;pointer-events:none;
  background:#fff;border-radius:7px;
  box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.045);
  transition:transform var(--ios-segment) var(--ios-nav-spring);
}
[data-seg-key]>button{transition:color .18s ease-out}
.seg:before{inset:-6px 0}
.reco-tab:before{inset:-8px 0}
.center-tab:before,.ftab:before{inset:-7px 0}

/* sheet material, interactive drag, compositor-only close */
.sheet{animation:iosSheetIn .4s var(--ios-spring) backwards;will-change:transform;box-shadow:0 -1px 0 rgba(0,0,0,.08)}
.sheet-grab,.sheet-head{touch-action:none}
.modal-layer.closing{pointer-events:none}
.modal-layer.closing .modal-card{opacity:0;transform:scale(.96);transition:opacity .16s ease-out,transform .18s var(--ios-spring)}
@keyframes iosSheetIn{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* review fixes */
.gal-cap{bottom:38px}

function e(v){
  return String(v === null || typeof v === 'undefined' ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function nowLabel(ts){
  var d = new Date(ts || Date.now());
  return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function timeAgo(ts){
  if(!ts){ return '刚刚'; }
  var diff = Date.now() - Number(ts);
  if(diff < 60000){ return '刚刚'; }
  if(diff < 3600000){ return Math.floor(diff / 60000) + ' 分钟前'; }
  if(diff < 86400000){ return Math.floor(diff / 3600000) + ' 小时前'; }
  if(diff < 604800000){ return Math.floor(diff / 86400000) + ' 天前'; }
  return nowLabel(ts).split(' ')[0];
}
function hashStr(str){
  var h = 2166136261;
  str = String(str);
  for(var i = 0; i < str.length; i++){
    h ^= str.charCodeAt(i);
    h += (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24);
  }
  return Math.abs(h);
}

function findById(list, id){

  return null;
}

}
function hasKey(k){
  try{ return localStorage.getItem(PREFIX + k) !== null; }catch(err){ return Object.prototype.hasOwnProperty.call(MEM_STORE, PREFIX + k); }
}
function getData(k, fallback){
  var raw;
  try{ raw = localStorage.getItem(PREFIX + k); }catch(err){ raw = MEM_STORE[PREFIX + k]; }
  if(raw === null || typeof raw === 'undefined'){ return fallback; }
  try{ return JSON.parse(raw); }catch(err){ return fallback; }
}
function setData(k, value){
  var raw = JSON.stringify(value);
  try{ localStorage.setItem(PREFIX + k, raw); }catch(err){ MEM_STORE[PREFIX + k] = raw; }
}
function dropData(k){
  try{ localStorage.removeItem(PREFIX + k); }catch(err){ delete MEM_STORE[PREFIX + k]; }
}
function clearDemo(){
  try{
    var keys = [];
    for(var i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if(k && k.indexOf(PREFIX) === 0){ keys.push(k); }
    }
    for(var j = 0; j < keys.length; j++){ localStorage.removeItem(keys[j]); }
  }catch(err){
    for(var p in MEM_STORE){ if(MEM_STORE.hasOwnProperty(p) && p.indexOf(PREFIX) === 0){ delete MEM_STORE[p]; } }
  }
}

function proofFor(order){
  if(order.cert){ return order.cert; }
  var d = new Date(order.created || Date.now());
  var ymd = d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate());
  var seed = String(order.id || '') + String(order.partner || '') + String(order.created || '');
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for(var i = 0; i < 4; i++){ code += chars.charAt(hashStr(seed + '_' + i) % chars.length); }
  return 'HH-' + ymd + '-' + code;
}

function freshenSeedTimes(){
  var now = Date.now();
  var feedOffsets = [2, 3, 5, 24, 30, 52, 168, 240, 1];
  var i;
  for(i = 0; i < SEED_INTEREST.length; i++){
    SEED_INTEREST[i].created = now - (feedOffsets[i] || 48) * 3600000;
  }
  var orderOffsets = [2, 26, 300];
  for(i = 0; i < SEED_ORDERS.length; i++){
    SEED_ORDERS[i].created = now - (orderOffsets[i] || 30) * 3600000;
  }
  for(i = 0; i < SEED_POSTS.length; i++){
    SEED_POSTS[i].created = now - (i + 1) * 1800000;
  }
}
function ensureSeed(){
  freshenSeedTimes();
  if(!hasKey('posts')){
    setData('posts', SEED_POSTS);
    setData('orders', SEED_ORDERS);
    setData('interest', SEED_INTEREST);
    setData('mall', SEED_MALL);
    setData('mallFav', ['m1','m3']);
    setData('notes', ['i3']);
    setData('msg', SEED_MSG);
    setData('cart', SEED_CART);
    setData('wish', SEED_WISH);
    setData('user', SEED_USER);
  }else{
    if(!hasKey('orders')){ setData('orders', SEED_ORDERS); }
    if(!hasKey('interest')){ setData('interest', SEED_INTEREST); }
    if(!hasKey('mall')){ setData('mall', SEED_MALL); }
    if(!hasKey('mallFav')){ setData('mallFav', ['m1','m3']); }
    if(!hasKey('notes')){ setData('notes', ['i3']); }
    if(!hasKey('msg')){ setData('msg', SEED_MSG); }
    if(!hasKey('cart')){ setData('cart', SEED_CART); }
    if(!hasKey('wish')){ setData('wish', SEED_WISH); }
    if(!hasKey('user')){ setData('user', SEED_USER); }
  }
  ensureMyHave();
}

function ensureMyHave(){
  var posts = getPosts();
  var own = [], i;
  for(i = 0; i < posts.length; i++){
    if(posts[i].mine && posts[i].type === 'have' && !posts[i].sale){ own.push(posts[i]); }
  }
  if(!own.length){
    var defaults = [];
    for(i = 0; i < SEED_POSTS.length; i++){
      if(SEED_POSTS[i].mine && !SEED_POSTS[i].sale && defaults.length < 3){ defaults.push(clone(SEED_POSTS[i])); }
    }
    for(i = 0; i < defaults.length; i++){
      var dup = false;
      for(var j = 0; j < posts.length; j++){ if(posts[j].id === defaults[i].id){ dup = true; } }
      if(!dup){ posts.push(defaults[i]); }
    }
    savePosts(posts);
  }
}

function diffLabel(diff, dir){
  diff = num(diff);
  if(!diff || dir === 'even'){ return '平换'; }
  if(dir === 'pay'){ return '你补 ¥' + money(diff); }

}
function diffShort(diff, dir){
  diff = num(diff);
  if(!diff || dir === 'even'){ return '平换'; }
  return (dir === 'pay' ? '需补 ¥' : '可收 ¥') + money(diff);
}
function statusOf(order){
  if(order.status === 'pending'){ return {label:'等待 ' + (order.partner || '对方') + ' 确认', cls:''}; }
  if(order.status === 'deposit'){ return {label:'已确认 · 待交付', cls:'green'}; }
  if(order.status === 'delivery'){ return {label:'交付中', cls:'blue'}; }
  return {label:'已完成', cls:'green'};
}
function stepOf(status){
  if(status === 'pending'){ return 1; }
  if(status === 'deposit'){ return 2; }
  if(status === 'delivery'){ return 3; }
  return 4;
}
function stepName(status){
  if(status === 'pending'){ return '提案'; }
  if(status === 'deposit'){ return '确认'; }
  if(status === 'delivery'){ return '交付'; }
  return '存证';
}
function getMatches(){
  var mine = myHave(), all = getPosts(), out = [], i, j;
  for(i = 0; i < mine.length; i++){
    for(j = 0; j < all.length; j++){
      var their = all[j];
      if(their.type !== 'have' || their.mine || their.sale || their.sync === false || !their.val){ continue; }
      var ratio = Math.abs(num(mine[i].val) - num(their.val)) / Math.max(1, Math.max(num(mine[i].val), num(their.val)));
      var score = 0;
      if(ratio <= .12){ score += 30; }
      else if(ratio <= .3){ score += 22; }
      else if(ratio <= .5){ score += 12; }
      else { score += 4; }
      if(mine[i].city === their.city){ score += 25; }
      if(num(their.credit) >= 85){ score += 20; }
      if(mine[i].cat === their.cat){ score += 15; }
      if(mine[i].cat === '技能' && their.cat === '技能'){ score += 10; }
      score = Math.min(99, score);
      var diff = Math.abs(num(mine[i].val) - num(their.val));
      var diffDir = num(their.val) > num(mine[i].val) ? 'pay' : (num(their.val) < num(mine[i].val) ? 'get' : 'even');
      out.push({
        id:'mt_' + mine[i].id + '_' + their.id,
        mineId:mine[i].id,
        theirsId:their.id,
        score:score,
        diff:diff,
        diffDir:diffDir
      });
    }
  }
  out.sort(function(a, b){
    if(b.score !== a.score){ return b.score - a.score; }
    return a.diff - b.diff;
  });
  out = out.slice(0, 5);
  setData('matches', out);
  return out;
}

function searchResultsHtml(q){
  var query = String(q || '').trim().toLowerCase();
  if(!query){
    return '<div class="search-empty">搜索闲置、技能、城市或精选</div>';
  }
  var posts = getPosts(), mall = getMall(), recs = getInterest();
  var out = '', rows = '', i, item, text;
  for(i = 0; i < posts.length; i++){
    item = posts[i];
    text = [item.title, item.desc, item.cat, item.city, item.user].join(' ').toLowerCase();
    if(text.indexOf(query) !== -1){
      rows += searchResultRow('post', item.id, item.title, [item.cat, item.cond, item.city].filter(Boolean).join(' · '), item.emoji, item.color);
    }
  }
  if(rows){ out += '<div class="search-group-title">闲置与技能</div>' + rows; }
  rows = '';
  for(i = 0; i < mall.length; i++){
    item = mall[i];
    text = [item.title, item.subtitle, item.desc, item.cond, item.promo].join(' ').toLowerCase();
    if(text.indexOf(query) !== -1){
      rows += searchResultRow('mall', item.id, item.title, ['平台精选', item.cond].filter(Boolean).join(' · '), item.emoji, item.color);
    }
  }
  if(rows){ out += '<div class="search-group-title">平台精选</div>' + rows; }
  rows = '';
  for(i = 0; i < recs.length; i++){
    item = recs[i];
    text = [item.title, item.desc, item.cat, item.user, item.city].join(' ').toLowerCase();
    if(text.indexOf(query) !== -1){
      rows += searchResultRow('reco', item.id, item.title, ['推荐', item.user].filter(Boolean).join(' · '), item.emoji, item.bg);
    }
  }
  if(rows){ out += '<div class="search-group-title">推荐</div>' + rows; }
  return out || '<div class="search-empty">没有找到「' + e(q) + '」<br>换个关键词试试。</div>';
}

function orderCard(o){
  var st = statusOf(o);
  var step = stepOf(o.status);
  var mineCount = o.mineIds ? o.mineIds.length : 1;
  var mineVal = num(o.valMine);
  var theirVal = num(o.val);
  var actions = '';
  if(o.status === 'pending'){
    actions = '<button class="tx-btn subtle" data-act="withdrawOrder" data-id="' + e(o.id) + '">撤回提案</button>' +
      '<button class="tx-btn primary" data-act="openProposal" data-id="' + e(o.id) + '">查看提案</button>';
  } else if(o.status === 'deposit'){
    actions = '<button class="tx-btn subtle" data-act="openProposal" data-id="' + e(o.id) + '">提案详情</button>' +
      '<button class="tx-btn primary" data-act="startDelivery" data-id="' + e(o.id) + '">开始交付</button>';
  } else if(o.status === 'delivery'){
    actions = '<button class="tx-btn subtle" data-act="openProposal" data-id="' + e(o.id) + '">提案详情</button>' +
      '<button class="tx-btn primary" data-act="confirmComplete" data-id="' + e(o.id) + '">确认完成</button>';
  }
  var proof = '';
  if(o.status === 'done'){
    var stars = '';
    for(var i = 1; i <= 5; i++){
      stars += '<button class="star-btn ' + (num(o.rate) >= i ? 'on' : '') + '" data-act="rateOrder" data-id="' + e(o.id) + '" data-n="' + i + '" aria-label="评分 ' + i + ' 星">' + icon('star', 17) + '</button>';
    }
    proof = '<div class="tx-proof">' + icon('check', 13) + '<span>互换存证 ' + e(proofFor(o)) + '</span></div>' +
      '<div class="tx-rating"><div class="stars">' + stars + '</div><span class="tx-rate-label">' + (num(o.rate) ? '本次互换评分 · ' + o.rate + '.0' : '点击星星完成评分') + '</span></div>';
  }
  return '<article class="tx-card">' +
    '<div class="tx-top">' +
      '<div class="tx-user">' + avatar(o.partner || '对方', o.partnerBg || '#E3DDD1', 'av-xs') + '<span>' + e(o.partner || '对方') + '</span></div>' +
      '<span class="status-pill ' + st.cls + '">' + e(st.label) + '</span>' +
    '</div>' +
    '<div class="tx-items">' +
      '<div class="tx-side">' +
        '<div class="tx-label">你换出 · 参考 ¥' + money(mineVal) + '</div>' +
        '<div class="tx-thumb" style="background:' + e(o.a && o.a.color ? o.a.color : '#E4DCCD') + '">' + e(o.a && o.a.emoji ? o.a.emoji : '📦') + (mineCount > 1 ? '<span class="tx-count">' + mineCount + '</span>' : '') + '</div>' +
        '<div class="tx-name">' + e(o.a && o.a.title ? o.a.title : '我的物品') + '</div>' +
      '</div>' +
      '<div class="tx-arrow">' + icon('swap', 17) + '</div>' +
      '<div class="tx-side right">' +
        '<div class="tx-label">你换来 · 参考 ¥' + money(theirVal) + '</div>' +
        '<div class="tx-thumb" style="background:' + e(o.b && o.b.color ? o.b.color : '#D9E1E5') + ';margin-left:auto">' + e(o.b && o.b.emoji ? o.b.emoji : '🎁') + '</div>' +
        '<div class="tx-name">' + e(o.b && o.b.title ? o.b.title : '对方的物品') + '</div>' +
      '</div>' +
    '</div>' +
    (o.status === 'pending' || o.status === 'deposit' || o.status === 'delivery' ? '<div class="tx-diff" style="text-align:center">' + diffShort(o.diff, o.diffDir) + ' · ' + e(o.delivery || '同城面交') + '</div>' : '') +
    '<div class="tx-progress-line"><div class="tx-progress">' +
      '<span class="tx-seg ' + (step >= 1 ? 'on' : '') + '"></span>' +
      '<span class="tx-seg ' + (step >= 2 ? 'on' : '') + '"></span>' +
      '<span class="tx-seg ' + (step >= 3 ? 'on' : '') + '"></span>' +
      '<span class="tx-seg ' + (step >= 4 ? 'on' : '') + '"></span>' +
    '</div><span class="tx-step-label">' + step + '/4 ' + stepName(o.status) + '</span></div>' +
    proof +
    (actions ? '<div class="tx-actions">' + actions + '</div>' : '') +
  '</article>';
}
function centerGuide(){
  return '<section class="guide-card">' +

    '</div>' +
    '<div class="guide-foot">C2C 互换由双方自主协商，平台不参与交易、不沉淀资金。换值参考与抵扣额度不可提现、不可转让、不可流通。</div>' +
  '</section>';
}
function renderSwapCenter(){
  var tab = APP.params.tab || 'pending';
  if(tab !== 'pending' && tab !== 'ongoing' && tab !== 'done'){ tab = 'pending'; }
  var orders = getOrders();
  var pendingList = [], activeList = [], doneList = [], i;
  for(i = 0; i < orders.length; i++){
    var o = orders[i];
    if(o.status === 'pending'){ pendingList.push(o); }
    else if(o.status === 'deposit' || o.status === 'delivery'){ activeList.push(o); }
    else if(o.status === 'done'){ doneList.push(o); }
  }
  pendingList.sort(function(a, b){ return num(b.created) - num(a.created); });
  activeList.sort(function(a, b){ return num(b.created) - num(a.created); });
  doneList.sort(function(a, b){ return num(b.created) - num(a.created); });
  var list = tab === 'pending' ? pendingList : (tab === 'ongoing' ? activeList : doneList);
  var sub = '';
  if(tab === 'pending'){
    sub = pendingList.length ? pendingList.length + ' 个提案等待对方回应 · 对方确认后进入交付' : '暂无待确认提案，去广场找一个刚好的配对';
  } else if(tab === 'ongoing'){
    sub = activeList.length ? activeList.length + ' 件正在互换 · 交付完成后由双方确认并生成存证' : '暂无进行中的互换，确认提案后会进入这里';
  } else {
    sub = doneList.length ? doneList.length + ' 件已完成 · 每笔互换都有可查存证与评分' : '暂无已完成的互换，完成第一笔后会留下存证';
  }
  var cards = '';
  for(i = 0; i < list.length; i++){ cards += orderCard(list[i]); }
  if(!list.length){
    cards = '<div class="center-empty"><b>这一栏还是空的</b>提案、确认、交付、存证，每一步都会记录在这里。</div>';
  }
  var tabs = [
    {k:'pending', label:'待确认', n:pendingList.length},
    {k:'ongoing', label:'进行中', n:activeList.length},
    {k:'done', label:'已完成', n:doneList.length}
  ];
  var tabsHtml = '';
  for(i = 0; i < tabs.length; i++){
    tabsHtml += '<button class="center-tab ' + (tab === tabs[i].k ? 'on' : '') + '" data-act="centerTab" data-tab="' + tabs[i].k + '">' + tabs[i].label + '<em>' + tabs[i].n + '</em></button>';
  }
  return '<div class="center-page">' +
    '<header class="topbar"><button class="icon-btn press" data-act="back" aria-label="返回">' + icon('back', 23) + '</button><div class="topbar-center"><div class="t-title">互换中心</div></div><div class="topbar-actions"><button class="icon-btn press" data-act="goPrivacy" aria-label="平台规则">' + icon('shield', 20) + '</button></div></header>' +
    '<div class="center-head"><div><div class="center-title">我的互换</div><div class="center-subtitle">' + e(sub) + '</div></div></div>' +
    '<div class="center-tabs" data-seg-key="center" role="tablist" aria-label="互换状态">' + tabsHtml + '</div>' +
    '<div class="center-list stagger"><div class="tab-caption">' + e(sub) + '</div>' + cards + '</div>' +
    centerGuide() +
  '</div>';
}

function fitMatchTitles(){

  for(var i = 0; i < titles.length; i++){
    var el = titles[i];
    var size = 16;
    el.style.fontSize = size + 'px';
    var guard = 0;
    while(el.scrollWidth > el.clientWidth + 1 && size > 11 && guard < 20){
      size -= 0.5;
      el.style.fontSize = size + 'px';
      guard++;
    }
  }
}
function bindGalleryScroll(){
  var scrollers = document.querySelectorAll('.gallery-scroll');
  for(var i = 0; i < scrollers.length; i++){
    (function(scroller){
      var host = scroller.parentNode;
      var dots = host ? host.querySelectorAll('.gal-dot') : [];
      if(!dots.length){ return; }
      var raf = null;
      function update(){
        var slide = scroller.clientWidth || 1;
        var idx = Math.round(scroller.scrollLeft / slide);
        if(idx < 0){ idx = 0; }
        if(idx >= dots.length){ idx = dots.length - 1; }
        for(var d = 0; d < dots.length; d++){
          if(d === idx){ dots[d].classList.add('on'); }
          else{ dots[d].classList.remove('on'); }
        }
      }
      scroller.addEventListener('scroll', function(){
        if(raf){ return; }
        raf = window.requestAnimationFrame(function(){ raf = null; update(); });
      }, {passive:true});
    })(scrollers[i]);
  }
}
function setProfilePanel(index, animate, velocity){
  if(index < 0){ index = 0; }
  if(index > 4){ index = 4; }
  var track = document.getElementById('profileTrack');
  var wrap = document.getElementById('profileSwipeWrap');
  var previous = APP.profileIndex;
  rememberSeg('profile');
  APP.profileIndex = index;
  var tabs = document.querySelectorAll('.ftab');
  for(var i = 0; i < tabs.length; i++){
    if(i === index){ tabs[i].classList.add('on'); }
    else{ tabs[i].classList.remove('on'); }
  }
  if(track){
    var width = wrap ? wrap.clientWidth : 0;
    var currentX = (typeof track.__x === 'number') ? track.__x : (-previous * width);
    var targetX = -index * width;
    track.style.transition = 'none';
    if(animate === false){
      cancelSpring('profile');
      track.__x = targetX;
      track.style.transform = 'translate3d(' + targetX + 'px,0,0)';
    }else{
      springTo('profile', currentX, velocity || 0, targetX, MOTION.spring, function(x){
        track.__x = x;
        track.style.transform = 'translate3d(' + x + 'px,0,0)';
      }, function(){
        track.__x = targetX;
        track.style.transform = 'translate3d(' + targetX + 'px,0,0)';
      });
    }
  }
  syncSegmentedControls();
}
function bindProfileSwipe(){
  var wrap = document.getElementById('profileSwipeWrap');
  var track = document.getElementById('profileTrack');
  if(!wrap || !track){ return; }
  var width = wrap.clientWidth || 1;
  track.style.transition = 'none';
  track.__x = -APP.profileIndex * width;
  track.style.transform = 'translate3d(' + track.__x + 'px,0,0)';
  var startX = 0, startY = 0, startPanelX = 0, lastX = 0, lastT = 0, velocity = 0;
  var active = false, horizontal = false, startedIndex = 0, suppressClick = false;
  wrap.addEventListener('click', function(ev){
    if(!suppressClick){ return; }
    suppressClick = false;
    ev.preventDefault();
    ev.stopPropagation();
  }, true);
  function rubber(over, dimension){
    return over * dimension * 0.55 / (dimension + 0.55 * Math.abs(over));
  }
  wrap.addEventListener('touchstart', function(ev){
    if(ev.touches.length !== 1){ return; }
    startX = ev.touches[0].clientX;
    startY = ev.touches[0].clientY;
    lastX = startX;
    lastT = nowMs();
    velocity = 0;
    width = wrap.clientWidth || 1;
    startedIndex = APP.profileIndex;
    startPanelX = (typeof track.__x === 'number') ? track.__x : (-startedIndex * width);
    track.style.transition = 'none';
    active = true;
    horizontal = false;
  }, {passive:true});
  wrap.addEventListener('touchmove', function(ev){
    if(!active || ev.touches.length !== 1){ return; }
    var dx = ev.touches[0].clientX - startX;
    var dy = ev.touches[0].clientY - startY;
    if(!horizontal){
      if(Math.abs(dx) < 6 && Math.abs(dy) < 6){ return; }
      if(Math.abs(dy) > Math.abs(dx)){ active = false; return; }
      horizontal = true;
      suppressClick = true;
      cancelSpring('profile');
      startX = ev.touches[0].clientX;
      startPanelX = (typeof track.__x === 'number') ? track.__x : startPanelX;
      lastX = startX;
      lastT = nowMs();
      velocity = 0;
      dx = 0;
    }
    if(!horizontal){ return; }
    ev.preventDefault();
    var next = startPanelX + dx;
    var min = -4 * width;
    if(next > 0){ next = rubber(next, width); }
    else if(next < min){ next = min - rubber(min - next, width); }
    track.__x = next;
    track.style.transform = 'translate3d(' + next + 'px,0,0)';
    var t = nowMs();
    if(t > lastT){
      var instant = (ev.touches[0].clientX - lastX) / (t - lastT) * 1000;
      velocity = velocity * 0.7 + instant * 0.3;
      lastX = ev.touches[0].clientX;
      lastT = t;
    }
  }, {passive:false});
  wrap.addEventListener('touchend', function(){
    if(!active){ return; }
    active = false;
    if(nowMs() - lastT > 90){ velocity = 0; }
    if(!horizontal){ setProfilePanel(startedIndex, true, 0); return; }
    var projected = (typeof track.__x === 'number' ? track.__x : startPanelX) + velocity * 0.499;
    var next = Math.round(-projected / width);
    if(next < 0){ next = 0; }
    if(next > 4){ next = 4; }
    setProfilePanel(next, true, velocity);
    window.setTimeout(function(){ suppressClick = false; }, 350);
  });
  wrap.addEventListener('touchcancel', function(){
    active = false;
    setProfilePanel(startedIndex, true, 0);
  });
  if(!window.__profileResizeBound){
    window.__profileResizeBound = true;
    window.addEventListener('resize', function(){
      var w = document.getElementById('profileSwipeWrap');
      var t = document.getElementById('profileTrack');
      if(!w || !t || APP.route !== 'profile'){ return; }
      cancelSpring('profile');
      var px = -APP.profileIndex * (w.clientWidth || 1);
      t.__x = px;
      t.style.transition = 'none';
      t.style.transform = 'translate3d(' + px + 'px,0,0)';
      syncSegmentedControls();
    });
  }
}
function bindEdgeBack(){
  if(NAV_ROUTES[APP.route]){ return; }
  var page = document.querySelector('.page');
  if(!page){ return; }
  var startX = 0, startY = 0, active = false, dx = 0;
  page.addEventListener('touchstart', function(ev){
    if(ev.touches.length !== 1){ return; }
    startX = ev.touches[0].clientX;
    startY = ev.touches[0].clientY;
    active = startX < 28;
    dx = 0;
    if(active){ page.style.animation = 'none'; }
  }, {passive:true});
  page.addEventListener('touchmove', function(ev){
    if(!active || ev.touches.length !== 1){ return; }
    dx = ev.touches[0].clientX - startX;
    var dy = ev.touches[0].clientY - startY;
    if(dx <= 0 || Math.abs(dy) > Math.abs(dx)){ return; }
    ev.preventDefault();
    page.style.transition = 'none';
    page.style.transform = 'translateX(' + Math.min(dx * .55, 86) + 'px)';
    page.style.opacity = String(Math.max(.55, 1 - dx / 500));
  }, {passive:false});
  page.addEventListener('touchend', function(){
    if(!active){ return; }
    active = false;
    page.style.transition = 'transform .25s var(--spring), opacity .2s';
    page.style.transform = '';
    page.style.opacity = '';
    window.setTimeout(function(){ page.style.transition = ''; }, 280);
    if(dx > 70){ goBack(); }
  });
}

function readTranslateY(el){
  var value = window.getComputedStyle ? window.getComputedStyle(el).transform : '';
  if(!value || value === 'none'){ return 0; }
  try{
    if(window.DOMMatrixReadOnly){ return new DOMMatrixReadOnly(value).m42 || 0; }
  }catch(err){}
  var m = value.match(/^matrix\(([^)]+)\)$/);
  if(m){
    var parts = m[1].split(',');
    return parseFloat(parts[5]) || 0;
  }
  var m3 = value.match(/^matrix3d\(([^)]+)\)$/);
  if(m3){
    var parts3 = m3[1].split(',');
    return parseFloat(parts3[13]) || 0;
  }
  return 0;
}
function bindSheetGestures(){
  var sheet = document.querySelector('#sheetHost .sheet');
  if(!sheet){ return; }
  var scrim = document.querySelector('#overlay .scrim');
  var sheetH = Math.max(240, sheet.offsetHeight || window.innerHeight);
  sheet.__sheetH = sheetH;
  sheet.__sheetY = 0;
  sheet.__sheetV = 0;
  sheet.style.transform = 'translate3d(0,0,0)';
  if(scrim){ scrim.style.opacity = ''; }
  var dragging = false, startY = 0, startSheetY = 0, lastY = 0, lastT = 0, moveVelocity = 0;
  function rubber(over, dimension){
    return over * dimension * 0.55 / (dimension + 0.55 * Math.abs(over));
  }
  function setSheetY(y){
    sheet.__sheetY = y;
    sheet.style.transform = 'translate3d(0,' + y + 'px,0)';
    if(scrim){
      var fade = Math.max(0, Math.min(0.55, (y / sheetH) * 0.55));
      scrim.style.opacity = String(1 - fade);
    }
  }
  function start(ev, handle){
    if(dragging){ return; }
    if(ev.pointerType === 'mouse' && ev.button !== 0){ return; }
    if(ev.target.closest && ev.target.closest('button,input,textarea,select,a,.segmented,.my-pick-rail')){ return; }
    var wasClosing = APP.overlayDismissing;
    APP.overlayDismissing = false;
    APP.overlayCloseToken++;
    cancelSpring('sheet');
    var currentY = wasClosing ? readTranslateY(sheet) : ((typeof sheet.__sheetY === 'number') ? sheet.__sheetY : 0);
    sheet.style.animation = 'none';
    sheet.style.transition = 'none';
    sheet.style.transform = 'translate3d(0,' + currentY + 'px,0)';
    sheet.__sheetY = currentY;
    if(scrim){ scrim.style.transition = 'none'; scrim.style.opacity = '1'; }
    dragging = true;
    startY = ev.clientY;
    startSheetY = currentY;
    lastY = startY;
    lastT = nowMs();
    moveVelocity = 0;
    sheet.__sheetV = 0;
    try{ handle.setPointerCapture(ev.pointerId); }catch(err){}
  }
  function move(ev){
    if(!dragging){ return; }
    var raw = startSheetY + (ev.clientY - startY);
    var y;
    if(raw < 0){ y = -rubber(-raw, sheetH); }
    else if(raw > sheetH){ y = sheetH + rubber(raw - sheetH, sheetH); }
    else{ y = raw; }
    setSheetY(y);
    var t = nowMs();
    if(t > lastT){
      var instant = (ev.clientY - lastY) / (t - lastT) * 1000;
      moveVelocity = moveVelocity * 0.7 + instant * 0.3;
      lastY = ev.clientY;
      lastT = t;
    }
    sheet.__sheetV = moveVelocity;
    if(ev.cancelable){ ev.preventDefault(); }
  }
  function end(){
    if(!dragging){ return; }
    dragging = false;
    if(nowMs() - lastT > 90){ moveVelocity = 0; sheet.__sheetV = 0; }
    var dismiss = sheet.__sheetY > sheetH * 0.35 || sheet.__sheetV > 550;
    var target = dismiss ? sheetH + 24 : 0;
    sheet.style.animation = 'none';
    sheet.style.transition = 'none';
    springTo('sheet', sheet.__sheetY, sheet.__sheetV, target, MOTION.sheet, function(y){
      setSheetY(Math.max(-2, y));
    }, function(){
      if(dismiss){ closeOverlay(); }
      else{
        APP.overlayDismissing = false;
        setSheetY(0);
        if(scrim){ scrim.style.transition = ''; }
      }
    });
  }
  function bindHandle(handle){
    if(!handle){ return; }
    handle.addEventListener('pointerdown', function(ev){ start(ev, handle); });
    handle.addEventListener('pointermove', move, {passive:false});
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  }
  bindHandle(sheet.querySelector('.sheet-grab'));
  bindHandle(sheet.querySelector('.sheet-head'));
}
function openOverlay(html, kind){
  var overlay = document.getElementById('overlay');
  var host = document.getElementById('sheetHost');

  if(page){ page.style.animation = 'none'; }
  document.body.classList.add('lock');
  APP.overlayOpen = true;
  APP.overlayDismissing = false;
  APP.overlayCloseToken++;
  APP.overlayKind = kind || '';
  if(host.querySelector('[data-seg-key]')){ syncSegmentedControls(); }
  bindSheetGestures();
}
function closeOverlay(){
  var overlay = document.getElementById('overlay');
  var host = document.getElementById('sheetHost');
  var kind = APP.overlayKind;
  if(document.activeElement && document.activeElement.blur){ document.activeElement.blur(); }
  cancelSpring('sheet');
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden', 'true');
  host.innerHTML = '';
  var scrim = overlay.querySelector('.scrim');
  if(scrim){ scrim.style.opacity = ''; scrim.style.transition = ''; }
  document.body.classList.remove('lock');
  APP.overlayOpen = false;
  APP.overlayDismissing = false;
  APP.overlayCloseToken++;
  APP.overlayKind = '';
  if(kind === 'thread' && APP.route === 'messages'){
    refreshPage(true);
  }

function dismissOverlay(){
  if(!APP.overlayOpen || APP.overlayDismissing){ return; }
  var sheet = document.querySelector('#sheetHost .sheet');
  var modal = document.querySelector('#sheetHost .modal-card');
  var scrim = document.querySelector('#overlay .scrim');
  if(reduceMotion || (!sheet && !modal)){ closeOverlay(); return; }
  APP.overlayDismissing = true;
  var token = ++APP.overlayCloseToken;
  function finish(){
    if(token === APP.overlayCloseToken && APP.overlayOpen){ closeOverlay(); }
  }
  cancelSpring('sheet');
  if(sheet){
    var sheetH = sheet.__sheetH || Math.max(240, sheet.offsetHeight || window.innerHeight);
    if(scrim){ scrim.style.transition = 'opacity .3s ease-out'; scrim.style.opacity = '0'; }
    sheet.style.animation = 'none';
    sheet.style.transition = 'transform .38s var(--ios-spring)';
    sheet.style.transform = 'translate3d(0,' + (sheetH + 24) + 'px,0)';
    sheet.__sheetY = sheetH + 24;
    window.setTimeout(finish, 400);
    return;
  }
  var layer = modal.closest ? modal.closest('.modal-layer') : null;
  if(scrim){ scrim.style.transition = 'opacity .2s ease-out'; scrim.style.opacity = '0'; }
  modal.style.animation = 'none';
  if(layer){ layer.classList.add('closing'); }
  window.setTimeout(finish, 210);
}

  for(var i = 0; i < opts.length; i++){
    html += '<button class="publish-option' + (opts[i].mode === 'swap' ? ' main' : '') + '" data-act="choosePublish" data-mode="' + opts[i].mode + '">' +
      '<span class="po-ico">' + icon(opts[i].ico, 21) + '</span>' +
      '<span class="po-main"><b>' + opts[i].title + '</b><span>' + opts[i].desc + '</span></span>' +
      '<span class="po-arrow">' + icon('chevron', 17) + '</span>' +

ACTIONS.choosePublish = function(el){
  var mode = el.getAttribute('data-mode') || 'swap';
  closeOverlay();
  APP.publish = newPublishDraft(mode);
  navigate('publish');
};
ACTIONS.switchPublishMode = function(){
  syncPublishFromDOM();
  if(!APP.publish){ APP.publish = newPublishDraft('swap'); }
  var order = ['work','idle','swap'];
  var idx = 0;
  for(var i = 0; i < order.length; i++){ if(order[i] === APP.publish.mode){ idx = i; } }
  APP.publish.mode = order[(idx + 1) % 3];
  APP.motion = 'segment';
  renderCurrent();
  window.scrollTo(0, 0);
  showToast('已切换到「发布' + modeLabel(APP.publish.mode) + '」');
};

    html += '<button class="palette-chip press" data-act="pickPalette" data-index="' + i + '">' +

ACTIONS.toggleTopic = function(el){
  if(!APP.publish){ return; }
  var topic = el.getAttribute('data-topic');
  var list = APP.publish.topics, idx = -1, i;
  for(i = 0; i < list.length; i++){ if(list[i] === topic){ idx = i; } }
  if(idx >= 0){ list.splice(idx, 1); el.classList.remove('on'); }
  else{
    if(list.length >= 3){ showToast('最多选择 3 个话题'); return; }
    list.push(topic);
    el.classList.add('on');
  }
};
ACTIONS.toggleWanted = function(el){
  if(!APP.publish){ return; }
  var type = el.getAttribute('data-type');
  var list = APP.publish.wanted, idx = -1, i;
  for(i = 0; i < list.length; i++){ if(list[i] === type){ idx = i; } }
  if(idx >= 0){ list.splice(idx, 1); el.classList.remove('on'); }
  else{ list.push(type); el.classList.add('on'); }
};
ACTIONS.toggleDraftSwitch = function(el){
  if(!APP.publish){ return; }
  var field = el.getAttribute('data-field');
  APP.publish[field] = !APP.publish[field];
  var sw = el.querySelector('.switch');
  if(sw){
    if(APP.publish[field]){ sw.classList.add('on'); }
    else{ sw.classList.remove('on'); }
  }
};
ACTIONS.submitPublish = function(){
  syncPublishFromDOM();
  if(!APP.publish){ return; }
  var d = APP.publish;
  var hit = detectBanned([d.title, d.desc, d.cat, d.location, d.challenge].join(' '));
  if(hit){
    showModal({
      icon:'shield',
      title:'无法发布 · 命中禁售类目',
      body:'系统检测到「' + e(hit.label) + '」相关内容，已阻止本次发布。<br><br>13 类商品禁止发布：药品、食品、烟草、管制器具、文物、医疗服务、学科教培、游戏代练、游戏账号、虚拟货币、预付卡、不动产、机动车。',
      buttons:[{label:'修改内容', cls:'btn-primary', act:'closeOverlay'}],
      note:'发布拦截在本地完成，不会写入帖子数据。'
    });
    return;
  }
  if(!d.title || !d.title.trim()){ showToast('先给内容写一个标题'); return; }
  if(!d.images.length){ showToast('请先选择至少一张图片'); return; }
  var user = getUser();
  var img = d.images[0];
  if(d.mode === 'work'){
    var interest = getInterest();
    interest.unshift({
      id:'i_' + Date.now(), cat:d.cat || '生活', title:d.title.trim(),
      body:d.desc.trim() || '记录一次关于旧物与交换的日常。', emoji:img.emoji, bg:img.bg,
      coverNote:(d.topics[0] || '换换日常').replace('#',''), city:user.city,
      user:user.name, userBg:user.avatar && user.avatar.bg ? user.avatar.bg : '#DCE8DD',
      likes:0, comments:0, followed:false, linkedPost:'', topics:d.topics,
      liked:false, saved:false, music:d.music, challenge:d.challenge,
      created:Date.now(), feed:d.visibility !== '仅好友', userComments:[]
    });
    saveInterest(interest);
    APP.publish = null;
    APP.recoTab = 'recommend';
    switchTab('recommend');
    showToast('作品已发布 · 已同步到推荐');
    return;
  }
  var valNum = d.mode === 'idle' ? num(d.price) : num(d.val);
  if(!valNum || valNum <= 0){ showToast(d.mode === 'idle' ? '请填写有效的定价' : '请填写换值参考'); return; }
  var newPost = {
    id:'p_' + Date.now(), type:'have',
    cat:guessCategory(d.title),
    title:d.title.trim(), desc:d.desc.trim(), val:valNum,
    price:d.mode === 'idle' ? valNum : undefined,
    cond:d.mode === 'idle' ? d.cond : '95新', city:d.location || user.city,
    user:user.name, credit:user.credit || 90, mine:true, sale:d.mode === 'idle',
    color:img.bg, emoji:img.emoji, images:d.images, time:'刚刚',
    status:d.mode === 'idle' ? 'sale' : 'available', cert:0, skill:false,
    topics:d.topics, music:d.music, acceptDiff:!!d.acceptDiff, wanted:d.wanted,
    visible:d.visibility, sync:!!d.sync, created:Date.now()
  };
  var posts = getPosts();
  posts.unshift(newPost);
  savePosts(posts);
  APP.publish = null;
  APP.seg = d.mode === 'idle' ? 'idle' : 'swap';
  switchTab('square');
  showToast(d.mode === 'idle' ? '闲置已发布 · 可在广场闲置区查看' : '互换已发布 · 配对会重新计算');
};
