ACTIONS.saveTag = function(){
  var input = document.getElementById('tagInput');
  var text = input ? input.value.trim() : '';
  if(!text){ showToast('请先输入标签内容'); return; }
  var u = getUser();
  u.tags = u.tags || [];
  for(var i = 0; i < u.tags.length; i++){
    if(u.tags[i].t === text){ showToast('这个标签已经存在'); return; }
  }
  u.tags.push({t:text, cert:0});
  saveUser(u);
  closeOverlay();
  refreshPage(true);
  showToast('标签已添加 · 状态为未认证');
};

/* ============ reco / messages ============ */
ACTIONS.openReco = function(el){ navigate('recoDetail', {id:el.getAttribute('data-id')}); };
ACTIONS.likeReco = function(el){
  var list = getInterest(), r = findById(list, el.getAttribute('data-id'));
  if(!r){ return; }
  r.liked = !r.liked;
  r.likes = Math.max(0, num(r.likes) + (r.liked ? 1 : -1));
  saveInterest(list);
  el.classList.toggle('on', !!r.liked);
  var count = document.getElementById('likeCount');
  if(count){ count.textContent = String(r.likes); }
  showToast(r.liked ? '已喜欢' : '已取消喜欢');
};
ACTIONS.saveReco = function(el){
  var list = getInterest(), r = findById(list, el.getAttribute('data-id'));
  if(!r){ return; }
  r.saved = !r.saved;
  saveInterest(list);
  var notes = getNotes(), idx = -1, i;
  for(i = 0; i < notes.length; i++){ if(notes[i] === r.id){ idx = i; } }
  if(r.saved && idx < 0){ notes.push(r.id); }
  if(!r.saved && idx >= 0){ notes.splice(idx, 1); }
  setData('notes', notes);
  el.classList.toggle('on', !!r.saved);
  showToast(r.saved ? '已收藏' : '已取消收藏');
};
ACTIONS.toggleFollow = function(el){
  var list = getInterest(), r = findById(list, el.getAttribute('data-id'));
  if(!r){ return; }
  r.followed = !r.followed;
  saveInterest(list);
  el.classList.toggle('on', !!r.followed);
  el.textContent = r.followed ? '已关注' : '关注';
  showToast(r.followed ? '已关注 ' + r.user : '已取消关注');
};
ACTIONS.sendComment = function(el){
  var list = getInterest(), r = findById(list, el.getAttribute('data-id'));
  if(!r){ return; }
  var input = document.getElementById('commentInput');
  var text = input ? input.value.trim() : '';
  if(!text){ showToast('说点什么再发送'); return; }
  var u = getUser();
  r.userComments = r.userComments || [];
  r.userComments.push({name:u.name, bg:u.avatar && u.avatar.bg ? u.avatar.bg : '#DCE8DD', text:text, time:'刚刚'});
  r.comments = num(r.comments) + 1;
  saveInterest(list);
  input.value = '';
  refreshPage(true);
  showToast('评论已发布');
};
ACTIONS.openThread = function(el){
  var id = el.getAttribute('data-id');
  var list = getMessages(), m = findById(list, id);
  if(!m){ return; }
  if(m.unread){ m.unread = 0; saveMessages(list); updateTabbar(); }
  APP.threadId = id;
  var bubbles = '';
  var thread = m.thread || [];
  for(var i = 0; i < thread.length; i++){
    var t = thread[i];
    bubbles += '<div class="bubble-row ' + (t.me ? 'me' : '') + '">' +
      (!t.me ? '<span class="av-xs" style="background:' + e(m.bg) + '">' + e(m.avatar || m.name.charAt(0)) + '</span>' : '') +
      '<div class="bubble"><div>' + e(t.text) + '</div><span>' + e(t.time || '') + '</span></div>' +
    '</div>';

function updateSwapUI(){
  if(!APP.swap){ return; }
  var target = postById(APP.swap.targetId);
  if(!target){ return; }
  var total = 0, count = 0;
  for(var i = 0; i < APP.swap.selected.length; i++){
    var p = postById(APP.swap.selected[i]);
    if(p){ total += num(p.val); count++; }
  }
  var cards = document.querySelectorAll('.pick-card');
  for(var c = 0; c < cards.length; c++){
    var cid = cards[c].getAttribute('data-id');
    if(APP.swap.selected.indexOf(cid) >= 0){ cards[c].classList.add('on'); }
    else{ cards[c].classList.remove('on'); }
  }
  var cnt = document.getElementById('swapPickCount');
  if(cnt){ cnt.innerHTML = '已选 <b>' + count + '</b> 件 · 合计参考 ¥' + money(total); }
  var diff = document.getElementById('swapDiff');
  var targetVal = num(target.val);
  if(diff){
    var dir = targetVal > total ? 'pay' : (targetVal < total ? 'get' : 'even');
    diff.className = 'diff-banner ' + dir;
    var textEl = diff.querySelector('.diff-text');
    var figEl = diff.querySelector('.diff-figure');
    if(textEl && figEl){
      if(!count){ textEl.textContent = '选择物品后自动计算差价'; figEl.textContent = ''; }
      else if(dir === 'pay'){ textEl.textContent = '你需补差价'; figEl.textContent = '¥' + money(targetVal - total); }
      else if(dir === 'get'){ textEl.textContent = '对方需补给你'; figEl.textContent = '¥' + money(total - targetVal); }
      else{ textEl.textContent = '换值刚好持平'; figEl.textContent = '平换'; }
    }
  }
  var submit = document.getElementById('swapSubmitBtn');
  if(submit){ submit.textContent = count > 1 ? '发出互换提案（' + count + ' 件换 1 件）' : '发出互换提案'; }
}

    delivery:APP.swap.delivery, note:note, created:Date.now(), rate:0, cert:null
  };
  var orders = getOrders();
  orders.unshift(order);
  saveOrders(orders);
  var msgs = getMessages();
  msgs.unshift({
    id:'msg_' + Date.now(), name:'换换小助手', avatar:'换', bg:'#E2F0E8',
    preview:'你的互换提案已送达，等待 ' + target.user + ' 确认。', time:'刚刚', unread:1, system:true,
    thread:[{me:false,text:'你的互换提案已送出，等待 ' + target.user + ' 确认。确认后即可进入交付。',time:'刚刚'},{me:false,text:'平台只做撮合与存证，不参与交易、不沉淀资金。',time:'刚刚'}]
  });
  saveMessages(msgs);
  updateTabbar();
  openSuccess(order.id);
};
function openSuccess(orderId){
  var o = findById(getOrders(), orderId);
  if(!o){ showToast('提案记录不存在'); return; }
  var count = o.mineIds ? o.mineIds.length : 1;
  var html = '<div class="sheet success-sheet">' +
    '<div class="sheet-grab"></div>' +
    '<div class="success-inner">' +
      '<div class="success-mark"><svg viewBox="0 0 82 82" aria-hidden="true"><circle class="success-ring" cx="41" cy="41" r="24"></circle><path class="success-tick" d="m29.5 41.6 8.2 8.1 15.2-16.2"></path></svg></div>' +
      '<h2>提案已发出</h2>' +
      '<p>已送达 ' + e(o.partner) + '，等对方确认后进入交付。<br>平台只做撮合与存证，不参与交易、不沉淀资金。</p>' +
      '<div class="success-order">' +
        '<div class="so-line"><span class="so-k">换出</span><span class="so-v">' + e(o.a.title) + ' · 参考 ¥' + money(o.valMine) + '</span></div>' +
        '<div class="so-line"><span class="so-k">换来</span><span class="so-v">' + e(o.b.title) + ' · 参考 ¥' + money(o.val) + '</span></div>' +
        '<div class="so-line"><span class="so-k">差价</span><span class="so-v">' + diffShort(o.diff, o.diffDir) + '</span></div>' +
        '<div class="so-line"><span class="so-k">交付</span><span class="so-v">' + e(o.delivery) + ' · ' + count + ' 件换 1 件</span></div>' +
      '</div>' +
      '<div class="success-timeline">' +
        '<div class="success-step done"><span class="ss-dot">' + icon('check', 9) + '</span><div><b>提案已发出</b><span>双方已收到提案内容</span></div></div>' +
        '<div class="success-step current"><span class="ss-dot">2</span><div><b>等待 ' + e(o.partner) + ' 确认</b><span>对方确认后进入交付</span></div></div>' +
        '<div class="success-step"><span class="ss-dot">3</span><div><b>交付</b><span>面交或快递，由双方自行完成</span></div></div>' +
        '<div class="success-step"><span class="ss-dot">4</span><div><b>互换存证</b><span>完成后生成可查存证号</span></div></div>' +
      '</div>' +
      '<div class="success-actions"><button class="btn btn-outline press" data-act="successContinue">继续逛</button><button class="btn btn-primary press" data-act="successProgress">查看进度</button></div>' +
      '<div class="submit-note">提案可在「互换中心 → 待确认」中查看 · 提交不会产生真实支付</div>' +
    '</div>' +
  '</div>';
  openOverlay(html, 'success');
}
ACTIONS.successContinue = function(){ closeOverlay(); APP.seg = 'swap'; switchTab('square'); };
ACTIONS.successProgress = function(){ closeOverlay(); navigate('swapcenter', {tab:'pending'}); };

/* ============ orders ============ */
ACTIONS.withdrawOrder = function(el){
  var id = el.getAttribute('data-id');
  showModal({icon:'trash', title:'撤回这个提案？', body:'撤回后将从待确认列表移除，对方不会收到进一步的交付提醒。', buttons:[
    {label:'保留提案', cls:'btn-outline', act:'closeOverlay'},
    {label:'确认撤回', cls:'btn-danger', act:'doWithdraw', attrs:' data-id="' + e(id) + '"'}
  ]});
};
ACTIONS.doWithdraw = function(el){
  var id = el.getAttribute('data-id');
  var orders = getOrders(), next = [];
  for(var i = 0; i < orders.length; i++){ if(String(orders[i].id) !== String(id)){ next.push(orders[i]); } }
  saveOrders(next);
  closeOverlay();
  refreshPage(true);
  showToast('提案已撤回');
};
ACTIONS.openProposal = function(el){
  var o = findById(getOrders(), el.getAttribute('data-id'));
  if(!o){ showToast('提案不存在'); return; }
  var step = stepOf(o.status);
  var stars = '';
  if(o.status === 'done'){
    for(var s = 1; s <= 5; s++){ stars += '<span class="star-btn ' + (num(o.rate) >= s ? 'on' : '') + '">' + icon('star', 16) + '</span>'; }
  }
  var actions = '';
  if(o.status === 'pending'){
    actions = '<button class="demo-action" data-act="simulateConfirm" data-id="' + e(o.id) + '">演示 · 模拟对方确认</button>' +
      '<div class="modal-actions" style="margin-top:7px"><button class="btn btn-outline press" data-act="closeOverlay">先不处理</button><button class="btn btn-danger press" data-act="withdrawOrder" data-id="' + e(o.id) + '">撤回提案</button></div>';
  } else if(o.status === 'deposit'){
    actions = '<div class="modal-actions" style="margin-top:7px"><button class="btn btn-outline press" data-act="closeOverlay">稍后</button><button class="btn btn-primary press" data-act="startDelivery" data-id="' + e(o.id) + '">开始交付</button></div>';
  } else if(o.status === 'delivery'){
    actions = '<div class="modal-actions" style="margin-top:7px"><button class="btn btn-outline press" data-act="closeOverlay">稍后</button><button class="btn btn-primary press" data-act="confirmComplete" data-id="' + e(o.id) + '">确认完成</button></div>';
  }
  var theirPost = postById(o.theirsId);
  var html = sheetHead('提案详情', o.kind + '互换 · ' + e(o.partner)) +
    '<div class="sheet-pad">' +
      '<div class="prop-status"><span class="status-pill ' + statusOf(o).cls + '">' + e(statusOf(o).label) + '</span><span class="ref-mark">参考换值 · 非现金</span></div>' +
      '<div class="prop-item-grid">' +
        '<div class="prop-item"><div class="tx-thumb" style="background:' + e(o.a.color) + ';width:100%;height:60px;font-size:27px">' + e(o.a.emoji) + '</div><div class="pi-label">你换出</div><div class="pi-title">' + e(o.a.title) + '</div><div class="pi-val">参考 ¥' + money(o.valMine) + '</div></div>' +
        '<div class="prop-mid">' + icon('swap', 18) + '</div>' +
        '<div class="prop-item"><div class="tx-thumb" style="background:' + e(o.b.color) + ';width:100%;height:60px;font-size:27px">' + e(o.b.emoji) + '</div><div class="pi-label">你换来</div><div class="pi-title">' + e(o.b.title) + '</div><div class="pi-val">参考 ¥' + money(o.val) + '</div></div>' +
      '</div>' +
      '<div class="prop-detail">' +
        '<div class="prop-line"><span class="pk">差价</span><span class="pv">' + diffShort(o.diff, o.diffDir) + '</span></div>' +
        '<div class="prop-line"><span class="pk">交付方式</span><span class="pv">' + e(o.delivery) + '</span></div>' +
        '<div class="prop-line"><span class="pk">对方</span><span class="pv">' + e(o.partner) + ' · 信用 ' + e(theirPost ? theirPost.credit : '—') + '</span></div>' +
        '<div class="prop-line"><span class="pk">留言</span><span class="pv">' + (o.note ? e(o.note) : '暂无留言') + '</span></div>' +
        '<div class="prop-line"><span class="pk">发起时间</span><span class="pv">' + e(nowLabel(o.created)) + '</span></div>' +
      '</div>' +
      '<div class="prop-timeline">' +
        '<div class="prop-step ' + (step >= 1 ? 'done' : '') + '"><span class="ps-dot">' + (step >= 1 ? icon('check', 8) : '') + '</span><span>提案</span></div>' +
        '<div class="prop-step ' + (step >= 2 ? 'done' : (step === 1 ? 'current' : '')) + '"><span class="ps-dot"></span><span>确认</span></div>' +
        '<div class="prop-step ' + (step >= 3 ? 'done' : (step === 2 ? 'current' : '')) + '"><span class="ps-dot"></span><span>交付</span></div>' +
        '<div class="prop-step ' + (step >= 4 ? 'done' : (step === 3 ? 'current' : '')) + '"><span class="ps-dot"></span><span>存证</span></div>' +
      '</div>' +
      (o.status === 'done' ? '<div class="tx-proof">' + icon('check', 13) + '<span>互换存证 ' + e(proofFor(o)) + '</span></div><div class="tx-rating"><div class="stars">' + stars + '</div><span class="tx-rate-label">' + (num(o.rate) ? o.rate + '.0 分' : '待评分') + '</span></div>' : '') +
      (o.status === 'pending' ? '<div class="prop-note-box">当前为待确认状态。为了让本地原型可以走通完整闭环，下面提供了「模拟对方确认」入口。</div>' : '') +
      '<div class="compliance-line">' + icon('shield', 14) + '<span>平台只做撮合与存证，不参与交易、不沉淀资金。换值参考不可当钱用。</span></div>' +
      actions +
    '</div>';
  openOverlay('<div class="sheet">' + html + '</div>', 'proposal');
};
ACTIONS.simulateConfirm = function(el){
  var orders = getOrders(), o = findById(orders, el.getAttribute('data-id'));
  if(!o){ return; }
  o.status = 'deposit';
  o.due = '等待交付';
  saveOrders(orders);
  closeOverlay();
  APP.route = 'swapcenter';
  APP.params = {tab:'ongoing'};
  renderCurrent();
  window.scrollTo(0, 0);
  showToast('对方已确认 · 已进入进行中');
};
ACTIONS.startDelivery = function(el){
  var orders = getOrders(), o = findById(orders, el.getAttribute('data-id'));
  if(!o){ return; }
  o.status = 'delivery';
  o.due = '交付中';
  saveOrders(orders);
  closeOverlay();
  if(APP.route === 'swapcenter'){
    APP.params = {tab:'ongoing'};
    refreshPage(false);
  } else {
    navigate('swapcenter', {tab:'ongoing'});
  }
  showToast('已开始交付 · 双方可自行面交或寄送');
};
ACTIONS.confirmComplete = function(el){
  var id = el.getAttribute('data-id');
  showModal({icon:'check', title:'确认完成这次互换？', body:'确认后将生成互换存证号，并进入已完成。平台不参与资金结算。', buttons:[
    {label:'还没有', cls:'btn-outline', act:'closeOverlay'},
    {label:'确认完成', cls:'btn-primary', act:'doComplete', attrs:' data-id="' + e(id) + '"'}
  ]});
};
ACTIONS.doComplete = function(el){
  var id = el.getAttribute('data-id');
  var orders = getOrders(), o = findById(orders, id);
  if(!o){ return; }
  o.status = 'done';
  o.due = '已完成';
  o.rate = num(o.rate);
  o.cert = proofFor(o);
  saveOrders(orders);
  closeOverlay();
  APP.route = 'swapcenter';
  APP.params = {tab:'done'};
  renderCurrent();
  window.scrollTo(0, 0);
  showToast('互换已完成 · 存证 ' + o.cert);
};
ACTIONS.rateOrder = function(el){
  var orders = getOrders(), o = findById(orders, el.getAttribute('data-id'));
  if(!o){ return; }
  o.rate = num(el.getAttribute('data-n'));
  saveOrders(orders);
  refreshPage(true);
  showToast('已评分 ' + o.rate + ' 星');
};

/* ============ global events ============ */
document.addEventListener('click', function(ev){
  var target = ev.target;
  var el = target && target.closest ? target.closest('[data-act]') : null;
  if(!el){ return; }
  var act = el.getAttribute('data-act');
  if(!act || !ACTIONS[act]){ return; }
  if(el.tagName === 'BUTTON' && el.disabled){ return; }
  if(el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA'){ ev.preventDefault(); }
  try{
    ACTIONS[act](el, ev);
  }catch(err){
    showToast('操作失败：' + err.message);
  }
});
document.addEventListener('input', function(ev){
  var el = ev.target;
  if(el && el.id === 'searchInput'){
    var results = document.getElementById('searchResults');
    if(results){ results.innerHTML = searchResultsHtml(el.value); }
    return;
  }
  var key = el.getAttribute ? el.getAttribute('data-draft') : null;
  if(key && APP.publish){
    APP.publish[key] = el.value;
    if(key === 'title'){
      var tc = document.getElementById('titleCount');
      if(tc){ tc.textContent = String(el.value.length); }
    }
    if(key === 'desc'){
      var dc = document.getElementById('descCount');
      if(dc){ dc.textContent = String(el.value.length); }
    }
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target;
  var key = el.getAttribute ? el.getAttribute('data-draft') : null;
  if(key && APP.publish){ APP.publish[key] = el.value; }
});
document.addEventListener('keydown', function(ev){
  if(ev.key === 'Enter' && ev.target && ev.target.id === 'threadInput'){
    ev.preventDefault();
    var btn = document.querySelector('.thread-send');
    if(btn){ ACTIONS.sendThread(btn); }
  }
  if(ev.key === 'Escape' && APP.overlayOpen){ dismissOverlay(); }
});

/* ============ boot ============ */
ensureSeed();
APP.route = 'square';
APP.params = {};
APP.seg = 'swap';
renderCurrent();


})();
</script>
</body>
</html>
