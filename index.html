<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<title>换换 · 把闲置换成刚刚好</title>
<style>
:root{
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --line:#E5E5EA;
  --line2:#D1D1D6;
  --ink:#000000;
  --mut:#8E8E93;
  --mut2:#C7C7CC;
  --pri:#147A4C;
  --pri-d:#0C5C38;
  --pri-l:#E8F5EC;
  --pri-ll:#F2FAF5;
  --red:#D70015;
  --amber:#C93400;
  --radius:16px;
  --radius-s:12px;
  --radius-xs:8px;
  --spring:cubic-bezier(.32,.72,0,1);
  --shadow:0 1px 2px rgba(0,0,0,.035),0 8px 24px rgba(0,0,0,.06);
  --shadow-s:0 1px 2px rgba(0,0,0,.028);
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  --deep:#1C1C1E;
  --clay:#8B5A45;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{
  margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  font-size:14px;line-height:1.5;overflow-x:hidden;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink);background:none;border:0;outline:0;min-width:0}
input::placeholder,textarea::placeholder{color:var(--mut2)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid rgba(20,122,76,.45);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
b,strong{font-weight:700}
em{font-style:normal}
ul{margin:0;padding:0;list-style:none}
.num{font-variant-numeric:tabular-nums}
.ico{display:block;flex:none}
.press{transition:transform .16s var(--spring)}
.press:active{transform:scale(.97)}
.press-soft:active{opacity:.72}
.hit{position:relative}
.hit:after{content:"";position:absolute;left:-4px;right:-4px;top:-4px;bottom:-4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

/* ============ app shell ============ */
#app{position:relative;max-width:900px;min-height:100vh;margin:0 auto;background:var(--bg)}
#viewHost{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.nav-hidden #viewHost{padding-bottom:0}
.page{animation:viewIn .3s cubic-bezier(.2,.8,.2,1) both}
.page.no-anim{animation:none}
.page-pad{padding-left:18px;padding-right:18px}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes modalIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes popIn{0%{transform:scale(.45)}62%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes drawRing{to{stroke-dashoffset:0}}
@keyframes drawTick{to{stroke-dashoffset:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.stagger>*{animation:cardIn .3s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.035s}
.stagger>*:nth-child(3){animation-delay:.07s}
.stagger>*:nth-child(4){animation-delay:.105s}
.stagger>*:nth-child(5){animation-delay:.14s}
.stagger>*:nth-child(6){animation-delay:.175s}
.stagger>*:nth-child(7){animation-delay:.21s}
.stagger>*:nth-child(8){animation-delay:.245s}

/* ============ top bar ============ */
.topbar{
  position:sticky;top:0;z-index:40;min-height:56px;display:flex;align-items:center;gap:4px;
  padding:0 8px;background:rgba(246,243,237,.90);backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid rgba(236,230,219,.7);
}
.topbar .t-title{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.2}
.topbar-center{flex:1;min-width:0}
.topbar-spacer{width:44px;height:44px;flex:none}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.icon-btn{width:44px;height:44px;min-height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none;position:relative}
.text-btn{min-height:44px;padding:0 10px;color:var(--pri);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:4px;position:relative}
.text-btn.muted{color:var(--mut)}
.text-btn.red{color:var(--red)}

/* ============ buttons ============ */
.btn{
  min-height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:0 16px;font-size:13.5px;font-weight:600;letter-spacing:.1px;position:relative;
  transition:transform .16s var(--spring),opacity .16s;
}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--pri);color:#fff;box-shadow:0 7px 16px rgba(20,122,76,.16)}
.btn-primary:active{background:var(--pri-d)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--pri-ll);color:var(--pri-d);border:1px solid rgba(20,122,76,.18)}
.btn-outline{background:transparent;border:1px solid var(--line2);color:var(--ink)}
.btn-danger{background:#FBEFEE;color:var(--red);border:1px solid rgba(214,69,63,.18)}
.btn-block{width:100%}
.btn-sm{min-height:38px;font-size:12px;border-radius:10px;padding:0 12px}
.btn-lg{min-height:50px;border-radius:14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link-btn{color:var(--pri);font-size:11.5px;font-weight:600;min-height:34px;display:inline-flex;align-items:center;gap:3px;position:relative}
.link-btn:after{content:"";position:absolute;inset:-5px}
.chip-btn{
  min-height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.52);
  font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;gap:4px;position:relative;
  transition:transform .16s var(--spring),background .18s,color .18s,border-color .18s;
}
.chip-btn:after{content:"";position:absolute;inset:-5px}
.chip-btn:active{transform:scale(.97)}
.chip-btn.on{background:var(--pri-l);border-color:rgba(20,122,76,.38);color:var(--pri-d);font-weight:600}
.mini-btn{
  min-height:34px;padding:0 12px;border-radius:10px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;position:relative;transition:transform .16s var(--spring)
}
.mini-btn:after{content:"";position:absolute;inset:-5px}
.mini-btn:active{transform:scale(.96)}
.mini-btn.green{background:var(--pri)}
.mini-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line2)}

/* ============ tabbar ============ */
.tabbar{
  position:fixed;left:50%;bottom:0;z-index:90;width:100%;max-width:900px;
  transform:translateX(-50%);height:calc(66px + env(safe-area-inset-bottom));
  padding:7px 9px calc(7px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:1fr 1fr 78px 1fr 1fr;align-items:end;
  background:rgba(250,248,243,.78);backdrop-filter:blur(20px) saturate(1.25);
  -webkit-backdrop-filter:blur(20px) saturate(1.25);
  border-top:1px solid rgba(221,211,195,.65);
  transition:transform .34s var(--spring),opacity .2s;
}
body.nav-hidden .tabbar{transform:translate(-50%,130%);opacity:0;pointer-events:none}
.tab{
  height:50px;min-height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;color:var(--mut);font-size:10px;font-weight:500;letter-spacing:.2px;position:relative;
  transition:transform .16s var(--spring),color .18s
}
.tab:active{transform:scale(.95)}
.tab .ico{opacity:.8}
.tab.on{color:var(--pri);font-weight:700}
.tab.on .ico{opacity:1}
.tab-dot{
  position:absolute;top:5px;right:calc(50% - 17px);min-width:15px;height:15px;border-radius:999;
  background:var(--red);color:#fff;font-size:9px;line-height:15px;text-align:center;padding:0 4px;
  box-shadow:0 0 0 2px rgba(250,248,243,.9);font-weight:700
}
.tab-plus{height:62px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;color:var(--mut);font-size:9.5px;position:relative}
.plus-circle{
  width:52px;height:52px;border-radius:50%;background:var(--pri);color:#fff;border:4px solid rgba(246,243,237,.96);
  display:flex;align-items:center;justify-content:center;position:relative;top:-12px;
  box-shadow:0 8px 20px rgba(20,122,76,.26);transition:transform .16s var(--spring)
}
.tab-plus:active .plus-circle{transform:scale(.94)}
.plus-circle .ico{width:24px;height:24px}

/* ============ square ============ */
.sq-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:19px 18px 13px}
.brandline{display:flex;align-items:center;gap:9px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(20,122,76,.17)}
.brand-name{font-size:24px;line-height:1;font-weight:700;letter-spacing:-.8px}
.brand-en{font-size:7.5px;line-height:1;letter-spacing:2.5px;color:var(--mut2);font-weight:700;margin-top:5px}
.sq-tagline{font-size:11.5px;color:var(--mut);margin-top:7px;letter-spacing:.1px}
.city-btn{
  display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 9px;margin-top:-3px;
  border:1px solid var(--line2);border-radius:999px;background:rgba(255,255,255,.55);font-size:11.5px;color:var(--ink);
  transition:transform .16s var(--spring)
}
.city-btn:active{transform:scale(.97)}
.trustline{
  width:calc(100% - 36px);margin:0 18px 10px;min-height:42px;border-radius:13px;border:1px solid rgba(20,122,76,.14);
  background:var(--pri-ll);display:flex;align-items:center;gap:8px;padding:8px 11px;font-size:11px;color:var(--pri-d);
  text-align:left;transition:transform .16s var(--spring)
}
.trustline:active{transform:scale(.99)}
.trustline .ico{color:var(--pri);opacity:.9}
.trustline .tl-main{flex:1;min-width:0;line-height:1.45}
.trustline .tl-main b{font-weight:600;color:var(--pri-d)}
.trustline .chev{color:rgba(12,92,56,.5)}

.segbar{display:flex;margin:4px 18px 0;border-bottom:1px solid var(--line);position:relative}
.seg{flex:1;height:48px;min-height:48px;font-size:14px;font-weight:500;color:var(--mut);display:flex;align-items:center;justify-content:center;position:relative;transition:color .18s}
.seg.on{color:var(--ink);font-weight:700}
.seg.on:after{content:"";position:absolute;bottom:-1.5px;left:50%;width:24px;height:3px;border-radius:3px;background:var(--pri);transform:translateX(-50%)}
.segment-body{padding-bottom:20px}
.section{padding:17px 18px 0}
.section.pb{bottom:20px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:16.5px;line-height:1.25;font-weight:700;letter-spacing:-.25px}
.sec-head p{font-size:10.8px;line-height:1.5;color:var(--mut);margin-top:4px}
.sec-head .sec-link{flex:none;color:var(--pri);font-size:11px;font-weight:600;min-height:34px;display:inline-flex;align-items:center;gap:2px;position:relative}
.sec-head .sec-link:after{content:"";position:absolute;inset:-5px}
.mini-note{font-size:10.5px;line-height:1.55;color:var(--mut2);padding:8px 2px 0}
.ref-mark{font-size:9.5px;color:var(--mut2);font-weight:500;letter-spacing:0;white-space:nowrap}

/* match rail */
.rail-wrap{margin:0 -18px;padding:0 18px;overflow:hidden}
.match-rail{display:flex;gap:11px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:2px 18px 16px;margin:0 -18px;scrollbar-width:none}
.match-rail::-webkit-scrollbar{display:none}
.match-card{
  flex:0 0 268px;scroll-snap-align:start;background:var(--card);border-radius:var(--radius);
  border:1px solid rgba(236,230,219,.9);box-shadow:var(--shadow);padding:14px 14px 13px;
  display:flex;flex-direction:column;min-width:0;position:relative;
}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px;min-height:20px}
.match-score{display:inline-flex;align-items:center;gap:4px;background:var(--pri-l);color:var(--pri-d);border-radius:999px;font-size:10.5px;font-weight:700;padding:4px 8px;line-height:1;letter-spacing:.1px}
.match-score i{width:5px;height:5px;border-radius:50%;background:var(--pri);display:block}
.match-diff{font-size:10px;color:var(--red);font-weight:600;white-space:nowrap;text-align:right;line-height:1.3}
.match-diff.even{color:var(--mut)}
.pair-row{display:flex;align-items:center;gap:10px;min-width:0}
.pair-thumb{
  width:42px;height:42px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:20px;border:1px solid rgba(52,38,14,.045);position:relative;overflow:hidden
}
.pair-thumb .pt-mark{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:5px 0 8px 0;background:rgba(255,255,255,.7);color:var(--pri);font-size:8px;display:flex;align-items:center;justify-content:center}
.pair-info{min-width:0;flex:1}
.pair-kicker{font-size:10px;line-height:1.3;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.pair-kicker b{font-weight:600;color:var(--ink)}
.pair-title{font-size:13.5px;line-height:1.3;font-weight:600;letter-spacing:-.15px;min-width:0;white-space:nowrap}
.pair-title .fit-inner{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair-skill{display:flex;align-items:center;gap:4px;margin-top:3px;font-size:8.5px;color:var(--mut2);line-height:1.2}
.pair-skill .skill-badge{font-size:8.5px}
.pair-link{height:19px;margin-left:20px;border-left:1px dashed var(--line2);position:relative}
.pair-link i{
  position:absolute;left:-8px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line2);
  color:var(--mut);font-style:normal;font-size:9px;display:flex;align-items:center;justify-content:center;line-height:1
}
.mc-foot{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:10px;min-height:30px;font-size:10.5px;color:var(--mut)}
.mc-foot .mini-av{width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#4D463C;flex:none;border:1px solid rgba(52,38,14,.04)}
.mc-foot .mc-name{color:var(--ink);font-weight:600}
.mc-foot .dotsep{color:var(--mut2)}
.mc-foot .mc-city{margin-left:auto;color:var(--mut)}
.match-card .btn{margin-top:9px;min-height:43px;font-size:12.5px;border-radius:12px}
.rail-foot{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--mut2);padding:2px 2px 0}
.match-empty{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow-s)}

/* available list */
.list-filter{display:flex;gap:6px;align-items:center}
.swap-list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);overflow:hidden}
.swap-row{display:flex;align-items:center;gap:12px;width:100%;min-height:78px;padding:12px 14px;border-bottom:1px solid var(--line);transition:transform .16s var(--spring);position:relative;text-align:left}
.swap-row:last-child{border-bottom:0}
.swap-row:active{transform:scale(.99)}
.thumb52{width:52px;height:52px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:25px;border:1px solid rgba(52,38,14,.045);position:relative;overflow:hidden}
.thumb52:before,.thumb86:before,.thumb64:before,.thumb72:before,.thumb44:before,.cover-thumb:before{
  content:"";position:absolute;width:72%;height:72%;border-radius:50%;background:rgba(255,255,255,.18);left:-24%;top:-28%
}
.swap-row-main{flex:1;min-width:0}
.swap-row-title{font-size:13.5px;line-height:1.35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.swap-row-title>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swap-row-meta{font-size:10.5px;line-height:1.45;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap-row-meta .money{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.swap-row-meta .sep{color:var(--mut2);margin:0 4px}
.swap-round{
  width:38px;height:38px;flex:none;border-radius:50%;background:var(--pri-l);color:var(--pri);border:1px solid rgba(20,122,76,.14);
  display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;transition:transform .16s var(--spring)
}
.swap-round:after{content:"";position:absolute;inset:-3px}
.swap-round:active{transform:scale(.92)}
.swap-round.mine{background:#F1EEE8;color:var(--mut);border-color:var(--line);font-size:9.5px;letter-spacing:.2px}
.skill-badge{
  display:inline-flex;align-items:center;gap:2px;flex:none;font-size:9px;font-weight:500;line-height:1;
  padding:2px 4px;border-radius:4px;background:rgba(118,118,128,.10);color:var(--mut);position:relative;white-space:nowrap
}
.skill-badge .bcheck{width:8px;height:8px;color:#7CB9EA;display:block}
.skill-badge.pending{color:var(--amber)}
.skill-badge.plain{color:var(--mut2)}

/* idle sale */
.idle-list{display:flex;flex-direction:column;gap:10px}
.idle-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);padding:12px;display:flex;gap:12px;align-items:center;position:relative}
.thumb86{width:86px;height:86px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:38px;border:1px solid rgba(52,38,14,.045);position:relative;overflow:hidden}
.idle-main{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
.idle-title{font-size:13.5px;line-height:1.35;font-weight:600;letter-spacing:-.1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idle-meta{font-size:10.2px;color:var(--mut);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idle-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:7px}
.price-red{color:var(--red);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.35px;line-height:1}
.price-red .cur{font-size:11px;font-weight:700;margin-right:1px}
.idle-price{font-size:20px}
.idle-note{font-size:10px;color:var(--mut);line-height:1.5;padding:9px 2px 0}

/* mall */
.official-strip{display:flex;align-items:center;gap:7px;margin-bottom:11px;font-size:10.5px;color:var(--mut)}
.self-pill{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:5px;background:#fff;border:1px solid var(--line);color:var(--ink);font-size:9px;font-weight:600;box-shadow:0 1px 4px rgba(52,38,14,.06)}
.self-pill i{width:4px;height:4px;border-radius:50%;background:var(--pri);display:block}
.mall-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.mall-card{
  background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);
  box-shadow:var(--shadow-s);transition:transform .16s var(--spring);position:relative;min-width:0;text-align:left
}
.mall-card:active{transform:scale(.98)}
.mall-pic{position:relative;width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.mall-pic:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(33,28,22,.045))}
.mall-emoji{font-size:49px;line-height:1;filter:saturate(.86);position:relative;z-index:1;text-shadow:0 4px 10px rgba(52,38,14,.08)}
.promo-badge{
  position:absolute;z-index:2;left:0;top:0;background:linear-gradient(135deg,#E35A52 0%,#CE342F 100%);color:#fff;
  font-size:10px;font-weight:800;padding:4px 9px 4px 7px;border-radius:5px 13px 13px 13px;letter-spacing:.2px;line-height:1.2;
  box-shadow:0 3px 8px rgba(178,42,37,.18)
}
.self-badge{
  position:absolute;z-index:2;right:8px;top:8px;background:rgba(255,255,255,.96);color:#5A5145;
  font-size:8.8px;font-weight:600;line-height:1.2;padding:3px 6px;border-radius:5px;letter-spacing:.1px;
  box-shadow:0 1px 5px rgba(52,38,14,.10);white-space:nowrap
}
.mall-body{padding:9px 10px 11px;min-width:0}
.mall-title-row{display:flex;align-items:center;gap:4px;min-width:0}
.cond-badge{flex:none;background:var(--pri);color:#fff;font-size:10.5px;line-height:1;font-weight:600;padding:3px 4px;border-radius:4px;letter-spacing:-.2px}
.mall-title{font-size:12.2px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:-.1px}
.mall-price-row{display:flex;align-items:baseline;gap:4px;margin-top:7px;flex-wrap:wrap}
.mall-price{font-size:21px;font-weight:800;letter-spacing:-.65px;color:var(--red);line-height:1;font-variant-numeric:tabular-nums}
.mall-price .cur{font-size:12.5px;font-weight:700;margin-right:1px;letter-spacing:0}
.mall-sub{font-size:9px;color:var(--red);opacity:.9;line-height:1.2;white-space:nowrap}
.mall-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.mini-tag{font-size:9px;line-height:1.2;color:var(--mut);border:1px solid var(--line2);padding:2px 4px;border-radius:4px;white-space:nowrap}
.mall-tags .mini-tag{font-size:10.5px;padding:2px 5px}
.mini-tag.green{color:var(--pri);border-color:rgba(20,122,76,.35);background:rgba(20,122,76,.035)}
.mall-note{font-size:10px;color:var(--mut2);line-height:1.55;padding:10px 2px 0}

/* ============ recommend feed ============ */
.reco-nav{
  position:sticky;top:0;z-index:38;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;
  min-height:55px;padding:0 7px;background:rgba(246,243,237,.90);backdrop-filter:blur(18px) saturate(1.2);
  -webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid rgba(236,230,219,.46)
}
.mini-brand{font-size:17px;font-weight:700;letter-spacing:-.5px;padding-left:7px}
.reco-tabs{display:flex;align-items:stretch;justify-content:center;gap:23px;height:55px;min-width:0}
.reco-tab{font-size:15.5px;line-height:1;color:var(--mut);font-weight:500;display:flex;align-items:center;justify-content:center;position:relative;padding:0 1px;min-height:44px;white-space:nowrap;transition:color .18s}
.reco-tab.on{font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:-.25px}
.reco-tab.on:after{content:"";position:absolute;left:50%;bottom:5px;width:20px;height:3px;border-radius:3px;background:var(--pri);transform:translateX(-50%)}
.red-dot{position:absolute;top:10px;right:-3px;width:7px;height:7px;border-radius:50%;background:#F73B4A;box-shadow:0 0 0 2.5px var(--bg)}
.feed-intro{padding:22px 18px 16px}
.feed-kicker{font-size:9.5px;line-height:1;font-weight:700;letter-spacing:2.2px;color:var(--mut2);text-transform:uppercase}
.feed-h1{font-size:25px;line-height:1.24;font-weight:700;letter-spacing:-.7px;margin-top:9px}
.feed-sub{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:7px}
.feed-list{padding:0 18px 10px}
.feed-card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-s);margin-bottom:14px;transition:transform .16s var(--spring)
}
.feed-card:active{transform:scale(.99)}
.feed-cover{position:relative;width:100%;height:205px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.feed-cover:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.14);left:-48px;top:-72px}
.feed-cover:after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,rgba(33,28,22,0),rgba(33,28,22,.13))}
.cover-emoji{font-size:65px;line-height:1;filter:saturate(.88);position:relative;z-index:1;text-shadow:0 7px 18px rgba(52,38,14,.10)}
.cover-note{position:absolute;z-index:2;left:13px;bottom:12px;font-size:10px;color:rgba(255,255,255,.9);letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.2)}
.cat-chip{
  position:absolute;z-index:3;left:12px;top:12px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
  color:var(--ink);font-size:9.5px;font-weight:600;padding:3px 7px;border-radius:5px;letter-spacing:.2px
}
.feed-body{padding:12px 13px 13px;padding-right:58px;min-width:0}
.feed-title{font-size:15.5px;line-height:1.45;font-weight:600;letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed-meta{display:flex;align-items:center;gap:5px;margin-top:9px;font-size:10.5px;color:var(--mut);min-width:0}
.av-xs{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:#4D463C;flex:none;border:1px solid rgba(52,38,14,.04)}
.feed-name{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:82px}
.feed-stats{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--mut);font-size:10px;white-space:nowrap}
.feed-stat{display:inline-flex;align-items:center;gap:3px}
.rec-swap{
  position:absolute;z-index:4;right:11px;bottom:10px;width:36px;height:36px;border-radius:50%;
  background:var(--pri);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 14px rgba(20,122,76,.24);border:1px solid rgba(255,255,255,.2);
  transition:transform .16s var(--spring)
}
.rec-swap:after{content:"";position:absolute;inset:-4px}
.rec-swap:active{transform:scale(.92)}
.feed-empty{text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:36px 18px;color:var(--mut);font-size:12px;box-shadow:var(--shadow-s)}

/* ============ detail ============ */
.detail-page{padding-bottom:calc(92px + env(safe-area-inset-bottom));background:var(--bg)}
.detail-author{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.detail-author .av-xs{width:30px;height:30px;font-size:10px}
.detail-author-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.follow-btn{
  min-height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(20,122,76,.45);color:var(--pri);
  font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;margin-left:auto;flex:none;position:relative
}
.follow-btn:after{content:"";position:absolute;inset:-6px}
.follow-btn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.gallery{position:relative;width:100%;overflow:hidden;background:#E8E1D6}
.gallery-scroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.gallery-scroll::-webkit-scrollbar{display:none}
.gal-slide{flex:0 0 100%;scroll-snap-align:center;height:360px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.gal-slide:before{content:"";position:absolute;width:245px;height:245px;border-radius:50%;background:rgba(255,255,255,.15);left:-70px;top:-85px}
.gal-slide:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);right:-50px;bottom:-70px}
.gal-emoji{font-size:104px;line-height:1;position:relative;z-index:1;filter:saturate(.88);text-shadow:0 10px 24px rgba(52,38,14,.10)}
.gal-cap{position:absolute;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.88);letter-spacing:.4px;white-space:nowrap;background:rgba(33,28,22,.16);padding:4px 9px;border-radius:999px;backdrop-filter:blur(5px)}
.gal-dots{position:absolute;z-index:4;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;align-items:center;padding:4px 7px;border-radius:999px;background:rgba(33,28,22,.20);backdrop-filter:blur(6px)}
.gal-dot{width:4px;height:4px;border-radius:999px;background:rgba(255,255,255,.48);transition:width .2s,background .2s}
.gal-dot.on{width:12px;background:#fff}
.detail-content{padding:18px 18px 8px}
.detail-kicker{font-size:10px;color:var(--mut);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.detail-title{font-size:20px;line-height:1.4;font-weight:700;letter-spacing:-.35px}
.detail-body{font-size:13.5px;line-height:1.9;color:#403A32;margin-top:10px;white-space:pre-wrap;word-break:break-word}
.topic-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.topic-static{font-size:11px;color:var(--pri);background:var(--pri-ll);border-radius:6px;padding:4px 7px;line-height:1.3}
.detail-date{font-size:10px;color:var(--mut2);margin-top:13px}
.comment-block{margin:17px 18px 0;border-top:1px solid var(--line);padding-top:15px}
.comment-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.comment-head h3{font-size:13px;font-weight:700;letter-spacing:-.1px}
.comment-head span{font-size:10px;color:var(--mut2)}
.comment-row{display:flex;gap:9px;padding:9px 0;min-width:0}
.comment-av{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#4D463C}
.comment-main{min-width:0;flex:1}
.comment-name{font-size:10.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.comment-text{font-size:12.5px;line-height:1.6;color:#383229;margin-top:3px;word-break:break-word}
.reco-bar{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:70;width:100%;max-width:900px;
  height:calc(62px + env(safe-area-inset-bottom));padding:0 10px env(safe-area-inset-bottom);
  display:flex;align-items:center;gap:2px;background:rgba(250,248,243,.92);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(221,211,195,.6)
}
.bar-icons{display:flex;align-items:center;gap:0}
.bar-icon{width:44px;height:48px;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--mut);position:relative;transition:transform .16s var(--spring)}
.bar-icon:active{transform:scale(.93)}
.bar-icon.on{color:var(--red)}
.bar-icon small{font-size:8.5px;line-height:1;color:var(--mut)}
.bar-icon.on small{color:var(--red)}
.swap-fab{
  position:absolute;left:50%;top:0;transform:translate(-50%,-28px);width:48px;height:48px;border-radius:50%;
  background:var(--pri);color:#fff;border:3px solid #fff;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;box-shadow:0 8px 20px rgba(20,122,76,.28);z-index:2;transition:transform .16s var(--spring)
}
.swap-fab:active{transform:translate(-50%,-28px) scale(.93)}
.comment-box{flex:0 0 auto;width:calc(50% - 42px);min-width:0;margin-left:auto;display:flex;align-items:center;gap:4px;background:rgba(118,118,128,.09);border-radius:999px;height:38px;padding:0 4px 0 12px}
.comment-box input{flex:1;min-width:0;font-size:12px;height:36px}
.comment-send{width:36px;height:36px;min-height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--pri);flex:none;position:relative}
.comment-send:after{content:"";position:absolute;inset:-4px}
.feed-follow-note{font-size:10px;color:var(--mut2);text-align:center;padding:14px 0 4px}

/* ============ messages ============ */
.msg-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:22px 18px 13px}
.msg-head h1{font-size:25px;line-height:1.2;letter-spacing:-.6px;font-weight:700}
.msg-head p{font-size:11px;color:var(--mut);margin-top:5px}
.msg-assist{
  margin:0 18px 12px;background:var(--pri-ll);border:1px solid rgba(20,122,76,.13);border-radius:15px;padding:12px;
  display:flex;align-items:center;gap:11px;text-align:left;width:calc(100% - 36px);transition:transform .16s var(--spring)
}
.msg-assist:active{transform:scale(.99)}
.msg-assist-ico{width:40px;height:40px;border-radius:13px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.msg-assist-main{flex:1;min-width:0}
.msg-assist-main b{font-size:12.5px;display:block;color:var(--pri-d);font-weight:600}
.msg-assist-main span{font-size:10.5px;color:var(--mut);display:block;margin-top:2px;line-height:1.4}
.msg-card{margin:0 18px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);overflow:hidden}
.msg-row{width:100%;min-height:70px;display:flex;align-items:center;gap:11px;padding:12px 13px;border-bottom:1px solid var(--line);position:relative;transition:background .18s;text-align:left}
.msg-row:last-child{border-bottom:0}
.msg-row:active{background:#FBF9F5}
.av-msg{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#4D463C;position:relative}
.av-msg .unread-dot{position:absolute;right:-1px;top:-1px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
.msg-main{flex:1;min-width:0}
.msg-line1{display:flex;align-items:center;gap:5px;min-width:0}
.msg-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.msg-time{margin-left:auto;font-size:9.5px;color:var(--mut2);white-space:nowrap;flex:none}
.msg-preview{font-size:11px;color:var(--mut);line-height:1.5;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-preview.unread{color:#4C453B}
.msg-badge{min-width:17px;height:17px;line-height:17px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;text-align:center;font-size:9px;font-weight:700;flex:none;margin-left:4px}
.msg-system{background:rgba(20,122,76,.035)}

/* ============ profile ============ */
.profile-page{padding-bottom:8px}
.profile-head{padding:20px 18px 4px;position:relative}
.prof-top{display:flex;align-items:flex-start;gap:13px;min-width:0}
.av-lg{width:70px;height:70px;border-radius:22px;flex:none;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700;color:#43503F;background:#DCE8DD;border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(52,38,14,.09);position:relative;overflow:hidden}
.av-lg:before{content:"";position:absolute;width:75px;height:75px;border-radius:50%;background:rgba(255,255,255,.22);left:-25px;top:-30px}
.prof-main{flex:1;min-width:0;padding-right:25px}
.prof-name{font-size:20px;line-height:1.2;font-weight:700;letter-spacing:-.4px;display:flex;align-items:center;gap:6px}
.prof-real{font-size:8.5px;color:var(--pri);background:var(--pri-l);border-radius:4px;padding:2px 4px;line-height:1.2;font-weight:600;letter-spacing:.2px}
.prof-id{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.4;flex-wrap:wrap}
.prof-id .id-sep{color:var(--mut2)}
.prof-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{
  position:relative;display:inline-flex;align-items:center;gap:3px;font-size:11px;line-height:1.35;color:var(--mut);
  background:rgba(118,118,128,.10);padding:4px 8px;border-radius:6px;max-width:100%;letter-spacing:.1px
}
.tag.has-cert{padding-right:15px}
.tag .ck{position:absolute;top:2px;right:3px;width:9px;height:9px;color:#7CB9EA;display:block;line-height:0}
.tag .ck svg{display:block;width:9px;height:9px}
.tag .tagst{font-size:8.5px;line-height:1.2;color:var(--amber);margin-left:1px}
.tag .tagst.plain{color:var(--mut2)}
.tag-add{border:1px dashed rgba(20,122,76,.6);background:transparent;color:var(--pri);padding:4px 7px;font-size:10.5px;min-height:24px;position:relative}
.tag-add:after{content:"";position:absolute;inset:-10px}
.prof-setting{position:absolute;right:8px;top:12px}
.prof-bio{font-size:12px;line-height:1.7;color:var(--mut);margin-top:9px;max-width:96%;word-break:break-word}
.prof-stats{display:flex;align-items:center;gap:17px;margin-top:11px;font-size:10.5px;color:var(--mut)}
.prof-stats b{font-size:13.5px;color:var(--ink);font-weight:700;margin-right:2px;font-variant-numeric:tabular-nums}
.swap-entry{
  margin:15px 18px 0;width:calc(100% - 36px);background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;
  display:flex;align-items:center;gap:11px;text-align:left;box-shadow:0 8px 20px rgba(33,28,22,.13);transition:transform .16s var(--spring)
}
.swap-entry:active{transform:scale(.99)}
.se-ico{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none;color:#BFE3CF}
.se-main{flex:1;min-width:0}
.se-main b{font-size:12.5px;font-weight:600;display:block}
.se-main span{font-size:10px;color:rgba(255,255,255,.6);margin-top:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap-entry .chev{color:rgba(255,255,255,.5)}
.profile-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:16px 18px 0;position:relative;z-index:2}
.ftab{
  min-height:38px;height:38px;border-radius:9px;font-size:12px;font-weight:500;color:var(--mut);
  display:flex;align-items:center;justify-content:center;position:relative;
  transition:background .2s,color .2s,transform .16s var(--spring)
}
.ftab:after{content:"";position:absolute;inset:-3px}
.ftab:active{transform:scale(.97)}
.ftab.on{color:#fff;font-weight:700;background:linear-gradient(135deg,var(--pri) 0%,var(--pri-d) 100%);box-shadow:0 4px 12px rgba(20,122,76,.18)}
.profile-swipe-wrap{overflow:hidden;margin-top:12px;touch-action:pan-y}
.profile-track{display:flex;width:500%;transition:transform .33s var(--spring);will-change:transform}
.ptab-panel{width:20%;flex:0 0 20%;padding:0 18px;min-height:210px;min-width:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.panel-head h3{font-size:12px;font-weight:700;letter-spacing:-.1px}
.panel-head span{font-size:10px;color:var(--mut2)}
.work-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.work-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;transition:transform .16s var(--spring);min-width:0}
.work-card:active{transform:scale(.98)}
.work-pic{width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:33px;position:relative;overflow:hidden}
.work-pic .cat-chip{left:7px;top:7px;font-size:8.5px;padding:2px 5px}
.work-body{padding:7px 8px 8px}
.work-title{font-size:11px;line-height:1.4;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.work-meta{font-size:9px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.compact-row:last-child{border-bottom:0}
.thumb44{width:44px;height:44px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;position:relative;overflow:hidden;border:1px solid rgba(52,38,14,.045)}
.compact-main{flex:1;min-width:0}
.compact-title{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-sub{font-size:9.5px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compact-price{font-size:11.5px;font-weight:700;color:var(--red);flex:none;font-variant-numeric:tabular-nums}
.panel-empty{background:rgba(255,255,255,.55);border:1px dashed var(--line2);border-radius:14px;padding:24px 16px;text-align:center;color:var(--mut);font-size:11px;line-height:1.7}
.panel-empty b{display:block;font-size:12.5px;color:var(--ink);margin-bottom:3px}
.orders-block{margin:17px 18px 0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);padding:13px 13px 11px}
.block-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.block-head h3{font-size:13.5px;font-weight:700;letter-spacing:-.15px}
.order-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:11px}
.order-cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:66px;border-radius:11px;position:relative;transition:background .16s}
.order-cell:active{background:#FAF7F2}
.order-ico{width:37px;height:37px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:#5C5347}
.order-label{font-size:10px;color:var(--mut);line-height:1.2}
.order-badge{position:absolute;top:0;right:calc(50% - 25px);min-width:16px;height:16px;border-radius:999px;background:var(--red);color:#fff;font-size:9px;line-height:16px;text-align:center;padding:0 4px;font-weight:700;box-shadow:0 0 0 2px #fff}
.tools-block{margin:12px 18px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);padding:13px 11px 9px}
.tools-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.tools-head h3{font-size:13.5px;font-weight:700;letter-spacing:-.15px}
.tools-head span{font-size:9.5px;color:var(--mut2)}
.tools-grid{display:grid;grid-template-columns:repeat(3,1fr);margin-top:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:74px;border-radius:12px;position:relative;transition:background .16s}
.tool:active{background:#FAF7F2}
.tool-ico{width:36px;height:36px;border-radius:12px;background:var(--pri-ll);color:var(--pri);display:flex;align-items:center;justify-content:center}
.tool span{font-size:10px;line-height:1.2;color:var(--mut)}

/* ============ publish ============ */
.publish-page{padding-bottom:28px}
.pub-head{position:sticky;top:0;z-index:42;display:flex;align-items:center;gap:3px;padding:0 8px;min-height:56px;background:rgba(246,243,237,.93);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border-bottom:1px solid rgba(236,230,219,.7)}
.pub-title{font-size:16px;font-weight:700;letter-spacing:-.2px;flex:1;text-align:center;line-height:1.2}
.pub-switch{min-height:44px;padding:0 6px;color:var(--pri);font-size:12px;font-weight:600;display:flex;align-items:center;gap:3px;flex:none;position:relative}
.pub-publish{min-height:36px;padding:0 13px;border-radius:999px;background:var(--pri);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .16s var(--spring);position:relative}
.pub-publish:after{content:"";position:absolute;inset:-4px}
.pub-publish:active{transform:scale(.95)}
.pub-body{padding:14px 18px 0}
.pub-section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);padding:13px;margin-bottom:12px}
.pub-sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pub-sec-title h3{font-size:12px;font-weight:700;letter-spacing:-.1px}
.pub-sec-title span{font-size:10px;color:var(--mut2);font-variant-numeric:tabular-nums}
.upload-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.up-tile{aspect-ratio:1/1;border-radius:13px;border:1px dashed var(--line2);background:#F7F3EC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:9.5px;position:relative;overflow:hidden;transition:transform .16s var(--spring)}
.up-tile:active{transform:scale(.97)}
.up-tile.filled{border:1px solid rgba(52,38,14,.05);background:#E4DDD1}
.up-tile .up-emoji{font-size:31px;line-height:1;filter:saturate(.9)}
.up-tile .up-color{font-size:8px;color:rgba(33,28,22,.48);position:absolute;left:6px;bottom:5px;letter-spacing:.2px}
.up-remove{position:absolute;right:4px;top:4px;z-index:2;width:24px;height:24px;min-height:24px;border-radius:50%;background:rgba(33,28,22,.62);color:#fff;display:flex;align-items:center;justify-content:center}
.up-remove:after{content:"";position:absolute;inset:-10px}
.up-add .plusline{width:24px;height:24px;border-radius:50%;background:rgba(20,122,76,.08);color:var(--pri);display:flex;align-items:center;justify-content:center;margin-bottom:1px}
.pub-title-input{width:100%;font-size:17px;line-height:1.5;font-weight:600;letter-spacing:-.2px;padding:1px 0 7px;border-bottom:1px solid var(--line)}
.pub-desc{width:100%;min-height:95px;resize:none;font-size:13.5px;line-height:1.8;padding:10px 0 0;display:block;word-break:break-word}
.pub-count{font-size:9.5px;color:var(--mut2);text-align:right;font-variant-numeric:tabular-nums;margin-top:3px}
.topic-chips{display:flex;flex-wrap:wrap;gap:7px}
.topic-chips .chip-btn{font-size:10.5px}
.music-row{display:flex;align-items:center;gap:8px;min-height:50px;padding:2px 0;width:100%;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:9px;position:relative;text-align:left}
.music-row:after{content:"";position:absolute;inset:-4px 0}
.music-ico{width:34px;height:34px;border-radius:10px;background:var(--pri-ll);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.music-main{flex:1;min-width:0}
.music-main b{font-size:11.5px;display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-main span{font-size:9.5px;display:block;color:var(--mut);margin-top:1px}
.music-more{font-size:10px;color:var(--mut2);display:flex;align-items:center;gap:2px;flex:none}
.field-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:49px;border-bottom:1px solid var(--line)}
.field-row:last-child{border-bottom:0}
.field-row label,.field-row .flabel{font-size:13px;color:var(--ink);flex:none}
.field-row .hint{font-size:9.5px;color:var(--mut2);margin-left:4px}
.field-control{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:4px;min-width:0}
.field-control select{max-width:150px;text-align:right;font-size:12.5px;color:var(--mut);appearance:none;-webkit-appearance:none;padding:10px 17px 10px 4px;background:transparent;direction:rtl}
.select-wrap{position:relative;display:flex;align-items:center;min-width:0}
.select-wrap .chev{position:absolute;right:0;color:var(--mut2);pointer-events:none}
.field-control input,.field-control textarea{text-align:right;font-size:12.5px;color:var(--ink);max-width:170px;padding:9px 0}
.field-control .money-input{max-width:110px;font-variant-numeric:tabular-nums}
.field-control .inline-prefix{font-size:12px;color:var(--mut);flex:none}
.switch-hit{width:48px;height:44px;display:flex;align-items:center;justify-content:flex-end;flex:none;position:relative}
.switch{width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s;flex:none}
.switch:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;left:2px;top:2px;box-shadow:0 1px 4px rgba(52,38,14,.18);transition:transform .22s var(--spring)}
.switch.on{background:var(--pri)}
.switch.on:after{transform:translateX(18px)}
.want-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:230px}
.want-chips .chip-btn{min-height:30px;padding:0 8px;font-size:10.5px}
.want-chips .chip-btn:after{inset:-7px}
.pub-note{display:flex;align-items:flex-start;gap:7px;padding:3px 4px 10px;color:var(--mut);font-size:10.5px;line-height:1.65}
.pub-note .ico{color:var(--amber);flex:none;margin-top:1px}
.pub-note button{color:var(--amber);text-decoration:underline;text-underline-offset:2px;min-height:24px}
.pub-tip{margin-top:2px;background:#FCF6E9;border:1px solid #EFE2C7;border-radius:12px;padding:10px 12px;font-size:10.5px;line-height:1.65;color:#7A632E}
.pub-tip b{color:#5F4C23}
.visually-hidden{display:none!important}

/* ============ sheets / overlay ============ */
#overlay{position:fixed;inset:0;z-index:200;visibility:hidden;pointer-events:none}
#overlay.show{visibility:visible;pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(33,28,22,.46);opacity:0;transition:opacity .26s ease;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#overlay.show .scrim{opacity:1}
#sheetHost{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;pointer-events:none;padding-top:env(safe-area-inset-top)}
.sheet{
  pointer-events:auto;width:100%;max-width:900px;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;
  background:var(--bg);border-radius:23px 23px 0 0;padding:0 18px calc(18px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 42px rgba(33,28,22,.16);animation:sheetUp .44s var(--spring) both;position:relative;
  -webkit-overflow-scrolling:touch
}
.sheet.short{max-height:80vh}
.sheet.full{max-height:96vh;border-radius:20px 20px 0 0}
.sheet-grab{width:38px;height:4px;border-radius:4px;background:var(--line2);margin:9px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;min-height:55px;position:sticky;top:0;z-index:5;background:var(--bg)}
.sheet-head h2{font-size:16px;font-weight:700;letter-spacing:-.2px;flex:1;text-align:center;line-height:1.2}
.sheet-head .icon-btn{background:rgba(118,118,128,.08)}
.sheet-sub{font-size:10.5px;line-height:1.6;color:var(--mut);text-align:center;margin:-4px 0 12px}
.sheet-pad{padding-top:2px}
.modal-layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;pointer-events:none}
.modal-card{pointer-events:auto;width:100%;max-width:360px;background:var(--bg);border-radius:19px;padding:21px 19px 17px;box-shadow:0 18px 60px rgba(33,28,22,.22);animation:modalIn .28s cubic-bezier(.2,.8,.2,1) both;position:relative}
.modal-icon{width:45px;height:45px;border-radius:15px;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;margin:0 auto 11px}
.modal-card h3{font-size:17px;font-weight:700;text-align:center;letter-spacing:-.25px;line-height:1.4}
.modal-card p{font-size:12px;line-height:1.7;color:var(--mut);text-align:center;margin-top:7px;word-break:break-word}
.modal-actions{display:flex;gap:8px;margin-top:17px}
.modal-actions .btn{flex:1;min-height:43px;font-size:12.5px;border-radius:11px}
.modal-note{font-size:9.5px;color:var(--mut2);line-height:1.5;text-align:center;margin-top:9px}

/* swap sheet */
.target-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin-bottom:15px;box-shadow:var(--shadow-s)}
.thumb64{width:64px;height:64px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-size:29px;border:1px solid rgba(52,38,14,.045);position:relative;overflow:hidden}
.target-main{flex:1;min-width:0}
.target-main h3{font-size:13.5px;font-weight:600;line-height:1.4;letter-spacing:-.15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.target-meta{display:flex;gap:5px;align-items:center;margin-top:4px;font-size:9.8px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.target-val{text-align:right;flex:none;padding-left:5px}
.target-val b{display:block;font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.4px}
.target-val span{display:block;font-size:8.5px;color:var(--mut2);margin-top:1px;white-space:nowrap}
.sheet-sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:15px 1px 8px}
.sheet-sec-head h3{font-size:12.5px;font-weight:700;letter-spacing:-.1px}
.sheet-sec-head span{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.sheet-sec-head span b{color:var(--pri);font-weight:700}
.my-pick-rail{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 9px;scrollbar-width:none;overscroll-behavior-x:contain}
.my-pick-rail::-webkit-scrollbar{display:none}
.pick-card{flex:0 0 130px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:7px;text-align:left;position:relative;transition:border-color .16s,box-shadow .16s,transform .16s;min-width:0}
.pick-card:active{transform:scale(.98)}
.pick-card.on{border:1.5px solid var(--pri);box-shadow:0 0 0 3px var(--pri-l)}
.pick-thumb{width:100%;height:59px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:27px;position:relative;overflow:hidden}
.pick-check{position:absolute;right:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--pri);color:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.15);z-index:2}
.pick-card.on .pick-check{display:flex}
.pick-title{font-size:10.5px;line-height:1.35;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}
.pick-val{font-size:9.5px;line-height:1.35;color:var(--mut);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.my-pick-empty{border:1px dashed var(--line2);border-radius:12px;padding:14px;font-size:10.5px;color:var(--mut);text-align:center;width:100%}
.diff-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pri-ll);border:1px solid rgba(20,122,76,.14);border-radius:12px;padding:10px 12px;margin:4px 0 12px;font-size:11.5px;color:var(--pri-d)}
.diff-banner .diff-figure{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.diff-banner.pay{background:#FCF6EB;border-color:#EFE1C5;color:#735A20}
.diff-banner.pay .diff-figure{color:var(--amber)}
.diff-banner.get .diff-figure{color:var(--pri)}
.segmented{display:flex;background:#EEE9DF;border-radius:12px;padding:3px;gap:2px}
.segmented button{flex:1;min-height:36px;height:36px;border-radius:9px;font-size:11.5px;color:var(--mut);display:flex;align-items:center;justify-content:center;transition:background .18s,color .18s;position:relative}
.segmented button:after{content:"";position:absolute;inset:-4px}
.segmented button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(52,38,14,.08)}
.sheet-textarea{width:100%;min-height:68px;resize:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.65;display:block}
.quick-msg{display:flex;gap:6px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.quick-msg::-webkit-scrollbar{display:none}
.quick-msg button{white-space:nowrap;font-size:10px;color:var(--mut);border:1px solid var(--line2);border-radius:999px;padding:5px 9px;min-height:30px;position:relative;flex:none;background:rgba(255,255,255,.5)}
.quick-msg button:after{content:"";position:absolute;inset:-7px}
.compliance-line{display:flex;align-items:flex-start;gap:6px;font-size:9.8px;line-height:1.6;color:var(--mut2);padding:13px 1px 11px}
.compliance-line .ico{flex:none;margin-top:1px;color:var(--mut2)}
.sheet-submit{position:sticky;bottom:0;padding:10px 0 0;background:var(--bg)}
.sheet-submit .btn{min-height:50px}
.submit-note{text-align:center;font-size:9px;line-height:1.5;color:var(--mut2);margin-top:7px}

/* success */
.success-sheet{background:var(--bg);padding:0 20px calc(22px + env(safe-area-inset-bottom))}
.success-inner{padding-top:14px;text-align:center}
.success-mark{width:82px;height:82px;margin:5px auto 12px;position:relative;animation:popIn .5s var(--spring) both}
.success-mark svg{width:82px;height:82px;display:block}
.success-ring{stroke:var(--pri);stroke-width:3;fill:var(--pri-ll);stroke-dasharray:151;stroke-dashoffset:151;animation:drawRing .55s .1s ease-out forwards}
.success-tick{stroke:var(--pri);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:36;stroke-dashoffset:36;animation:drawTick .38s .42s ease-out forwards}
.success-inner h2{font-size:20px;font-weight:700;letter-spacing:-.4px;line-height:1.35}
.success-inner p{font-size:11.5px;line-height:1.7;color:var(--mut);margin-top:7px}
.success-order{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px;margin-top:16px;text-align:left;box-shadow:var(--shadow-s)}
.success-order .so-line{display:flex;align-items:center;gap:8px;font-size:11.5px;line-height:1.6;color:var(--mut)}
.success-order .so-line+.so-line{margin-top:5px}
.success-order .so-line b{color:var(--ink);font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.success-order .so-line .grow{flex:1;min-width:0;text-align:right;color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.success-order .so-line .so-k{flex:none;width:58px;color:var(--mut2);font-size:10px}
.success-order .so-line .so-v{flex:1;min-width:0;text-align:right;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.success-timeline{margin:17px 3px 0;text-align:left;border-top:1px solid var(--line);padding-top:13px}
.success-step{display:flex;align-items:flex-start;gap:9px;position:relative;padding-bottom:13px}
.success-step:last-child{padding-bottom:0}
.success-step:before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1px;background:var(--line2)}
.success-step:last-child:before{display:none}
.ss-dot{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line2);background:var(--bg);flex:none;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:var(--mut2);font-size:8px;font-weight:700;margin-top:1px}
.success-step.done .ss-dot{background:var(--pri);border-color:var(--pri);color:#fff}
.success-step.current .ss-dot{border-color:var(--pri);background:var(--pri-l);color:var(--pri)}
.success-step b{font-size:11px;font-weight:600;display:block;color:var(--ink);line-height:1.4}
.success-step span{font-size:9.5px;color:var(--mut);line-height:1.5;display:block;margin-top:1px}
.success-actions{display:flex;gap:8px;margin-top:17px}
.success-actions .btn{flex:1;min-height:45px;font-size:12.5px;border-radius:11px}

/* proposal detail */
.prop-status{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.status-pill{display:inline-flex;align-items:center;gap:4px;min-height:23px;padding:0 8px;border-radius:999px;background:#FBF3E2;color:var(--amber);font-size:9.5px;font-weight:600;line-height:1.2;white-space:nowrap}
.status-pill.green{background:var(--pri-l);color:var(--pri-d)}
.status-pill.grey{background:#F1EEE8;color:var(--mut)}
.status-pill.blue{background:#FBF3E2;color:var(--amber)}
.prop-item-grid{display:grid;grid-template-columns:1fr 26px 1fr;gap:5px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;margin-bottom:11px}
.prop-item{min-width:0}
.prop-item .thumb52{width:100%;height:60px;border-radius:10px;font-size:27px}
.prop-item .pi-label{font-size:9px;color:var(--mut);margin-top:5px}
.prop-item .pi-title{font-size:10.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.prop-item .pi-val{font-size:9.5px;color:var(--mut);margin-top:1px;font-variant-numeric:tabular-nums}
.prop-mid{display:flex;justify-content:center;color:var(--pri);padding-top:22px}
.prop-detail{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;margin:4px 0 11px}
.prop-line{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;font-size:11px;line-height:1.7;padding:6px 1px}
.prop-line .pk{color:var(--mut);flex:none}
.prop-line .pv{text-align:right;color:var(--ink);min-width:0;word-break:break-word}
.prop-timeline{display:flex;align-items:flex-start;gap:0;margin:14px 1px 12px}
.prop-step{flex:1;position:relative;text-align:center;min-width:0}

/* ============ swap center ============ */

.center-list{padding:14px 18px 0}

.guide-head span{font-size:9px;color:rgba(255,255,255,.44);border:1px solid rgba(255,255,255,.16);border-radius:4px;padding:2px 5px;white-space:nowrap}
.guide-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:13px}
.guide-step{position:relative;min-width:0}

.guide-step span{display:block;font-size:8px;line-height:1.45;color:rgba(255,255,255,.45);margin-top:1px}

.cart-bar{
  position:fixed;left:50%;bottom:0;z-index:80;transform:translateX(-50%);width:100%;max-width:900px;
  min-height:calc(74px + env(safe-area-inset-bottom));padding:9px 13px calc(9px + env(safe-area-inset-bottom));

}

.trade-line .ico{color:var(--pri);flex:none;margin-top:2px}
.trade-line b{color:var(--ink);font-weight:500}
.mall-owner-note{background:var(--pri-ll);border:1px solid rgba(20,122,76,.13);border-radius:12px;padding:10px 11px;font-size:10px;line-height:1.7;color:var(--pri-d);margin-top:11px}
.mall-owner-note b{font-weight:600}
.mall-detail-bar{
  position:fixed;left:50%;bottom:0;z-index:80;transform:translateX(-50%);width:100%;max-width:900px;
  min-height:calc(74px + env(safe-area-inset-bottom));padding:8px 11px calc(8px + env(safe-area-inset-bottom));
  background:rgba(250,248,243,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid rgba(221,211,195,.6);display:flex;align-items:center;gap:7px
}
.sq-action{width:52px;height:52px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--mut);position:relative;flex:none;border-radius:9px}
.sq-action:active{background:rgba(118,118,128,.06)}
.sq-action.on{color:var(--pri)}
.sq-action small{font-size:8.5px;line-height:1}
.mall-detail-bar .btn{min-height:48px;border-radius:11px;font-size:12px;flex:1;min-width:0}
.mall-detail-bar .btn.service{background:var(--pri-ll);color:var(--pri-d);border:1px solid rgba(20,122,76,.20);flex:0 0 32%}
.mall-detail-bar .btn.trade{background:var(--pri);color:#fff;flex:1}

/* ============ settings / privacy / skills ============ */
.plain-page{padding-bottom:24px}
.plain-wrap{padding:14px 18px 0}
.settings-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s);overflow:hidden;margin-bottom:11px}
.set-row{display:flex;align-items:center;gap:10px;min-height:55px;padding:12px 13px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:#fff;transition:background .18s}
.set-row:last-child{border-bottom:0}
.set-row:active{background:#FBF8F3}
.set-ico{width:33px;height:33px;border-radius:10px;background:var(--pri-ll);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.set-main{flex:1;min-width:0}
.set-main b{font-size:12.5px;font-weight:600;display:block;line-height:1.4}
.set-main span{font-size:9.5px;color:var(--mut);display:block;line-height:1.5;margin-top:1px}
.set-row .chev{color:var(--mut2);flex:none}
.set-row .val{font-size:10px;color:var(--mut2);margin-left:auto;white-space:nowrap}
.set-row.danger .set-ico{background:#FBEFEE;color:var(--red)}
.set-row.danger .set-main b{color:var(--red)}
.privacy-hero{padding:18px 18px 0}
.privacy-hero h1{font-size:23px;line-height:1.25;font-weight:700;letter-spacing:-.55px}
.privacy-hero p{font-size:10.5px;color:var(--mut);line-height:1.7;margin-top:6px}
.privacy-wrap{padding:14px 18px 0}
.policy-card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-s);padding:14px;margin-bottom:10px}
.policy-card .policy-label{font-size:9px;font-weight:700;letter-spacing:1.2px;color:var(--mut2);display:flex;align-items:center;gap:5px;margin-bottom:6px}
.policy-card h2{font-size:15px;line-height:1.4;font-weight:700;letter-spacing:-.25px}
.policy-card p{font-size:11px;line-height:1.8;color:var(--mut);margin-top:6px}
.policy-card p b{color:var(--ink);font-weight:600}
.policy-card.c2c{border-top:3px solid var(--pri)}
.policy-card.mall{border-top:3px solid var(--ink)}
.policy-compare{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}
.compare-cell{background:var(--bg);border-radius:8px;padding:7px 8px;font-size:9.5px;line-height:1.6;color:var(--mut)}
.compare-cell b{display:block;color:var(--ink);font-size:10px;margin-bottom:2px}
.policy-list{margin-top:6px}
.policy-list li{font-size:10.5px;line-height:1.75;color:var(--mut);padding-left:12px;position:relative}
.policy-list li:before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--line2)}
.policy-list li b{color:var(--ink);font-weight:600}
.banned-grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.banned-tag{font-size:9.5px;line-height:1.3;color:#8A5A24;background:#FCF6EB;border:1px solid #EFE1C5;border-radius:5px;padding:3px 6px;white-space:nowrap}
.skill-status-list{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-s);overflow:hidden;margin-bottom:11px}
.skill-status-row{display:flex;align-items:center;gap:9px;padding:12px 13px;border-bottom:1px solid var(--line);min-width:0}
.skill-status-row:last-child{border-bottom:0}
.skill-status-main{flex:1;min-width:0}
.skill-status-main b{font-size:12px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-status-main span{font-size:9.5px;color:var(--mut);display:block;margin-top:2px;line-height:1.4}
.skill-state{display:inline-flex;align-items:center;gap:3px;font-size:9.5px;font-weight:600;white-space:nowrap;flex:none}
.skill-state.pass{color:var(--pri)}
.skill-state.pending{color:var(--amber)}
.skill-state.plain{color:var(--mut2)}
.skill-state .ico{color:#7CB9EA}
.bluecheck{display:inline-flex;width:11px;height:11px;color:#7CB9EA;flex:none}

/* toast */
.toast{
  position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  z-index:500;background:rgba(33,28,22,.94);color:#fff;font-size:12px;line-height:1.5;
  padding:10px 15px;border-radius:11px;max-width:min(360px,calc(100vw - 36px));box-shadow:0 8px 26px rgba(33,28,22,.22);
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s var(--spring);text-align:center;word-break:break-word
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.above-overlay{bottom:auto;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-10px)}
.toast.above-overlay.show{transform:translate(-50%,0)}

/* ============ late components ============ */
.publish-options{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.publish-option{
  display:flex;align-items:center;gap:11px;width:100%;min-height:70px;padding:12px 13px;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:15px;transition:transform .16s var(--spring);position:relative
}
.publish-option:active{transform:scale(.985)}
.publish-option.main{border-color:rgba(20,122,76,.26);background:linear-gradient(135deg,#FFFFFF 0%,var(--pri-ll) 100%)}
.po-ico{width:40px;height:40px;border-radius:13px;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.publish-option.main .po-ico{background:var(--pri);color:#fff}
.po-main{flex:1;min-width:0}
.po-main b{display:block;font-size:13.5px;font-weight:700;line-height:1.35}
.po-main span{display:block;font-size:10px;line-height:1.5;color:var(--mut);margin-top:3px}
.po-arrow{color:var(--mut2);flex:none;display:flex}
.sheet-input{
  width:100%;min-height:48px;background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:0 13px;font-size:14px;display:block
}
.palette-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:4px 0 6px}
.palette-chip{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding:2px 0;border-radius:11px}
.palette-swatch{
  width:100%;aspect-ratio:1/1;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:26px;border:1px solid rgba(52,38,14,.055);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)
}
.palette-name{font-size:9px;color:var(--mut);white-space:nowrap;line-height:1.2}
.song-list{display:flex;flex-direction:column;gap:2px;padding-bottom:5px}
.song-row{display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 3px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.song-row:last-child{border-bottom:0}
.song-play{width:32px;height:32px;border-radius:50%;background:var(--pri-ll);color:var(--pri);display:flex;align-items:center;justify-content:center;flex:none}
.song-name{flex:1;min-width:0;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song-time{font-size:9.5px;color:var(--mut2);flex:none;font-variant-numeric:tabular-nums}
.city-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:3px 0 8px}
.city-option{
  min-height:48px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;font-weight:500;
  transition:background .18s,border-color .18s,color .18s,transform .16s var(--spring)
}
.city-option:active{transform:scale(.97)}
.city-option.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:600}
.service-card{
  display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:12px;margin:4px 0 12px;box-shadow:var(--shadow-s)
}
.service-avatar{width:41px;height:41px;border-radius:13px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.service-card b{display:block;font-size:12.5px;font-weight:600}
.service-card span{display:block;font-size:9.5px;color:var(--mut);margin-top:2px}
.thread-list{
  height:calc(88vh - 225px);min-height:250px;overflow-y:auto;overscroll-behavior:contain;
  padding:6px 1px 10px;display:flex;flex-direction:column;gap:10px
}
.bubble-row{display:flex;align-items:flex-end;gap:7px;max-width:100%}
.bubble-row.me{justify-content:flex-end}
.bubble{
  max-width:78%;background:#fff;border:1px solid var(--line);border-radius:13px 13px 13px 4px;
  padding:9px 11px;font-size:12px;line-height:1.65;color:var(--ink);box-shadow:var(--shadow-s)
}
.bubble-row.me .bubble{background:var(--pri);border-color:var(--pri);color:#fff;border-radius:13px 13px 4px 13px}
.bubble>div{word-break:break-word}
.bubble>span{display:block;font-size:8px;line-height:1.3;color:var(--mut2);margin-top:4px;text-align:right}
.bubble-row.me .bubble>span{color:rgba(255,255,255,.55)}
.thread-composer{
  display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:4px 4px 4px 13px;min-height:46px
}
.thread-composer input{flex:1;min-width:0;font-size:12.5px;height:38px}
.thread-send{
  min-height:38px;padding:0 14px;border-radius:999px;background:var(--pri);color:#fff;font-size:11.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;position:relative;flex:none
}
.thread-send:after{content:"";position:absolute;inset:-4px}
.sheet.full{display:flex;flex-direction:column;height:88vh;max-height:96vh;overflow:hidden}
.sheet.full .thread-list{flex:1;min-height:0;height:auto}
.sheet.full .compliance-line{flex:none;padding-bottom:3px}

/* small screens */
@supports (padding:max(0px)){
  .topbar{padding-top:env(safe-area-inset-top);min-height:calc(56px + env(safe-area-inset-top))}
  .reco-nav{padding-top:env(safe-area-inset-top);min-height:calc(55px + env(safe-area-inset-top))}

  .msg-head{padding-top:calc(22px + env(safe-area-inset-top))}

  .profile-tabs{margin-left:28px;margin-right:28px}
  .ptab-panel{padding-left:28px;padding-right:28px}
  .orders-block,.tools-block{margin-left:28px;margin-right:28px}
  .msg-head{padding-left:28px;padding-right:28px}
  .msg-card,.msg-assist{margin-left:28px;margin-right:28px}
  .msg-assist{width:calc(100% - 56px)}
  .cart-wrap,.checkout-wrap,.plain-wrap,.privacy-wrap,.privacy-hero{padding-left:28px;padding-right:28px}
  .credit-card{margin-left:28px;margin-right:28px}
  .center-head{padding-left:28px;padding-right:28px}
  .center-tabs{margin-left:28px;margin-right:28px}
